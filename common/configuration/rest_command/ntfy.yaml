---
ntfy_notify:
  url: !secret ntfy_url
  method: POST
  headers:
    Authorization: !env_var NTFY_AUTH_TOKEN
    X-Markdown: "{{ 'yes' if markdown | default(false) else 'no' }}"
  content_type: "application/json"
  payload: >-
    {
      "topic": "{{ topic | default('tuxnet-test') }}",
      "title": "{{ title }}",
      "message": {{ message | tojson }},
      "tags": {{ tags | default([]) | tojson }},
      "priority": {{ ({'min': 1, 'low': 2, 'default': 3, 'high': 4, 'max': 5}[priority | default('default')]) }},
      "markdown": {{ markdown | default(false) | tojson }}
    }
