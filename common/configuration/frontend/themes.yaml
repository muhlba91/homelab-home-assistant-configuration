---
# Home Dashboard themes: family_dashboard (flat panels) and
# family_dashboard_chips (chip sections), each with light and dark mode.
# The colour palette is defined here once; views only use colour tokens.
# See DASHBOARD.md, "Design system".
themes:
  # Main theme: white panels on a darker page, flat rows inside, one shared palette.
  family_dashboard:
    ha-section-border-radius: "20px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light:
        primary-color: "#3b73c4"
        accent-color: "#c98a1d"
        rgb-primary-color: "59, 115, 196"
        rgb-accent-color: "201, 138, 29"
        primary-background-color: "#e6e9ee"
        secondary-background-color: "#e6e9ee"
        ha-section-background-color: "#ffffff"
        card-background-color: "#ffffff"
        primary-text-color: "#15171c"
        secondary-text-color: "#5b5f68"
        disabled-text-color: "#8a8e97"
        divider-color: "rgba(15, 17, 21, 0.13)"
        app-header-background-color: "#ffffff"
        mush-chip-background: "#f1f3f6"
        app-header-text-color: "#15171c"
        success-color: "#1f9d68"
        warning-color: "#c98a1d"
        error-color: "#d1404b"
        amber-color: "#c98a1d"
        rgb-amber: "201, 138, 29"
        orange-color: "#d97a2b"
        rgb-orange: "217, 122, 43"
        red-color: "#d1404b"
        rgb-red: "209, 64, 75"
        green-color: "#1f9d68"
        rgb-green: "31, 157, 104"
        blue-color: "#3b73c4"
        rgb-blue: "59, 115, 196"
        purple-color: "#7658e0"
        rgb-purple: "118, 88, 224"
        grey-color: "#8a8e97"
        rgb-grey: "138, 142, 151"
        yellow-color: "#c98a1d"
        rgb-yellow: "201, 138, 29"
        deep-orange-color: "#d97a2b"
        rgb-deep-orange: "217, 122, 43"
      dark:
        primary-color: "#78a0dc"
        accent-color: "#c29a5e"
        rgb-primary-color: "120, 160, 220"
        rgb-accent-color: "194, 154, 94"
        primary-background-color: "#121418"
        secondary-background-color: "#121418"
        ha-section-background-color: "#23262c"
        card-background-color: "#23262c"
        primary-text-color: "#e7e8eb"
        secondary-text-color: "#a3a8b1"
        disabled-text-color: "#737882"
        divider-color: "rgba(255, 255, 255, 0.12)"
        app-header-background-color: "#23262c"
        mush-chip-background: "#30333b"
        app-header-text-color: "#e7e8eb"
        success-color: "#5dba8f"
        warning-color: "#c29a5e"
        error-color: "#e07a82"
        amber-color: "#c29a5e"
        rgb-amber: "194, 154, 94"
        orange-color: "#d98c5f"
        rgb-orange: "217, 140, 95"
        red-color: "#e07a82"
        rgb-red: "224, 122, 130"
        green-color: "#5dba8f"
        rgb-green: "93, 186, 143"
        blue-color: "#78a0dc"
        rgb-blue: "120, 160, 220"
        purple-color: "#a394e3"
        rgb-purple: "163, 148, 227"
        grey-color: "#7d828c"
        rgb-grey: "125, 130, 140"
        yellow-color: "#c29a5e"
        rgb-yellow: "194, 154, 94"
        deep-orange-color: "#d98c5f"
        rgb-deep-orange: "217, 140, 95"

