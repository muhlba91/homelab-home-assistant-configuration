  # Playground themes (not used by the Home Dashboard). Each variant has a panel
  # theme and a chip theme and only lists what differs from the main themes.
  # Section panels have no shadow or blur variable in the frontend; only cards
  # (tiles, chips) do. Heading, tile icon and tile text variables are real
  # (checked against the frontend source).

  # Tinted: faint blue panels, richer blue, rounder panels and tiles.
  playground_tinted:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light: &t_light
        <<: *fd_light
        primary-color: "#2f6fd6"
        blue-color: "#2f6fd6"
        rgb-primary-color: "47, 111, 214"
        rgb-blue: "47, 111, 214"
        primary-background-color: "#dce5f3"
        secondary-background-color: "#dce5f3"
        ha-section-background-color: "#f8faff"
        card-background-color: "#f8faff"
        app-header-background-color: "#f8faff"
        mush-chip-background: "#eaf0fb"
      dark: &t_dark
        <<: *fd_dark
        primary-background-color: "#10131a"
        secondary-background-color: "#10131a"
        ha-section-background-color: "#1d2230"
        card-background-color: "#1d2230"
        app-header-background-color: "#1d2230"
        mush-chip-background: "#283044"
  playground_tinted_chips:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light: &tc_light
        <<: *t_light
        card-background-color: "#eaf0fb"
      dark: &tc_dark
        <<: *t_dark
        card-background-color: "#283044"

  # Glass: colourful gradient page, translucent panels over it.
  playground_glass:
    ha-section-border-radius: "26px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light: &g_light
        <<: *fd_light
        lovelace-background: "linear-gradient(135deg, #cfdcf5 0%, #e6dcf3 50%, #f6e7d8 100%)"
        ha-section-background-color: "rgba(255, 255, 255, 0.72)"
        card-background-color: "transparent"
        app-header-background-color: "rgba(255, 255, 255, 0.72)"
      dark: &g_dark
        <<: *fd_dark
        lovelace-background: "linear-gradient(135deg, #141a2b 0%, #1c1626 50%, #1f1a17 100%)"
        ha-section-background-color: "rgba(35, 38, 44, 0.72)"
        card-background-color: "transparent"
        app-header-background-color: "rgba(35, 38, 44, 0.72)"
  playground_glass_chips:
    ha-section-border-radius: "26px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light:
        <<: *fc_light
        lovelace-background: "linear-gradient(135deg, #cfdcf5 0%, #e6dcf3 50%, #f6e7d8 100%)"
        ha-section-background-color: "rgba(255, 255, 255, 0.72)"
        card-background-color: "rgba(241, 243, 246, 0.65)"
        app-header-background-color: "rgba(255, 255, 255, 0.72)"
      dark:
        <<: *fc_dark
        lovelace-background: "linear-gradient(135deg, #141a2b 0%, #1c1626 50%, #1f1a17 100%)"
        ha-section-background-color: "rgba(35, 38, 44, 0.72)"
        card-background-color: "rgba(48, 51, 59, 0.65)"
        app-header-background-color: "rgba(35, 38, 44, 0.72)"

  # Pop: the Tinted shape plus accent-coloured bold headings, squarer tile
  # icons, bolder tile names and a soft gradient page.
  playground_pop:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light: &p_light
        <<: *t_light
        lovelace-background: "linear-gradient(160deg, #e6edf9 0%, #d2def1 100%)"
        ha-heading-card-subtitle-color: "#2f6fd6"
      dark: &p_dark
        <<: *t_dark
        lovelace-background: "linear-gradient(160deg, #161b27 0%, #0d1016 100%)"
        ha-heading-card-subtitle-color: "#78a0dc"
  playground_pop_chips:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light: &pc_light
        <<: *p_light
        card-background-color: "#eaf0fb"
      dark: &pc_dark
        <<: *p_dark
        card-background-color: "#283044"

  # Bold: Pop with a coloured top bar and raised chips (a soft card shadow).
  playground_bold:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light:
        <<: *p_light
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
      dark:
        <<: *p_dark
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
  playground_bold_chips:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "0 3px 10px rgba(30, 60, 120, 0.14)"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light:
        <<: *pc_light
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
        card-background-color: "#ffffff"
      dark:
        <<: *pc_dark
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
        ha-card-box-shadow: "0 3px 10px rgba(0, 0, 0, 0.4)"

  # Lift: one elevation rule for every card. All tiles, rows and chips get the
  # same soft shadow; panel rows are white, chips are tinted. The coloured top
  # bar and the Pop headings and icons are kept.
  playground_lift:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light: &l_light
        <<: *p_light
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
        ha-section-background-color: "#f4f7fd"
        card-background-color: "#ffffff"
        ha-card-box-shadow: "0 2px 8px rgba(30, 60, 120, 0.12)"
      dark: &l_dark
        <<: *p_dark
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
        ha-section-background-color: "#1d2230"
        card-background-color: "#2a3245"
        ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.40)"
  playground_lift_chips:
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light:
        <<: *l_light
        card-background-color: "#e4ecfa"
      dark:
        <<: *l_dark
        card-background-color: "#343e56"
