---
themes:
  # Main theme: white section panels on a darker page for depth, flat rows inside.
  family_dashboard:
    primary-color: "#3b73c4"
    accent-color: "#c98a1d"
    ha-section-border-radius: "20px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light:
        primary-background-color: "#e6e9ee"
        secondary-background-color: "#e6e9ee"
        ha-section-background-color: "#ffffff"
        card-background-color: "#ffffff"
        primary-text-color: "#15171c"
        secondary-text-color: "#5b5f68"
        disabled-text-color: "#8a8e97"
        divider-color: "rgba(15, 17, 21, 0.13)"
      dark:
        primary-background-color: "#0b0c0e"
        secondary-background-color: "#0b0c0e"
        ha-section-background-color: "#202329"
        card-background-color: "#202329"
        primary-text-color: "#f4f4f2"
        secondary-text-color: "#a7abb3"
        disabled-text-color: "#6d717a"
        divider-color: "rgba(255, 255, 255, 0.14)"

  # Section variant: same panel, cards render as subtle grey chips (grouped items, pills, batteries).
  family_dashboard_chips:
    primary-color: "#3b73c4"
    accent-color: "#c98a1d"
    ha-section-border-radius: "20px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light:
        primary-background-color: "#e6e9ee"
        secondary-background-color: "#e6e9ee"
        ha-section-background-color: "#ffffff"
        card-background-color: "#f1f3f6"
        primary-text-color: "#15171c"
        secondary-text-color: "#5b5f68"
        disabled-text-color: "#8a8e97"
        divider-color: "rgba(15, 17, 21, 0.13)"
      dark:
        primary-background-color: "#0b0c0e"
        secondary-background-color: "#0b0c0e"
        ha-section-background-color: "#202329"
        card-background-color: "#2b2f37"
        primary-text-color: "#f4f4f2"
        secondary-text-color: "#a7abb3"
        disabled-text-color: "#6d717a"
        divider-color: "rgba(255, 255, 255, 0.14)"
