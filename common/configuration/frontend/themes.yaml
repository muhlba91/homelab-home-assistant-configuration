---
# Home Dashboard themes: family_dashboard (flat panels) and
# family_dashboard_chips (chip sections), each with light and dark mode.
# The colour palette is defined here once; views only use colour tokens.
# See DASHBOARD.md, "Design system".
themes:
  # Main theme: white panels on a darker page, flat rows inside, one shared palette.
  family_dashboard:
    ha-section-border-radius: "20px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light: &fd_light
        primary-color: "#3b73c4"
        accent-color: "#c98a1d"
        rgb-primary-color: "59, 115, 196"
        rgb-accent-color: "201, 138, 29"
        primary-background-color: "#e6e9ee"
        secondary-background-color: "#e6e9ee"
        ha-section-background-color: "#ffffff"
        card-background-color: "#ffffff"
        primary-text-color: "#15171c"
        secondary-text-color: "#5b5f68"
        disabled-text-color: "#8a8e97"
        divider-color: "rgba(15, 17, 21, 0.13)"
        app-header-background-color: "#ffffff"
        mush-chip-background: "#f1f3f6"
        app-header-text-color: "#15171c"
        success-color: "#1f9d68"
        warning-color: "#c98a1d"
        error-color: "#d1404b"
        amber-color: "#c98a1d"
        rgb-amber: "201, 138, 29"
        orange-color: "#d97a2b"
        rgb-orange: "217, 122, 43"
        red-color: "#d1404b"
        rgb-red: "209, 64, 75"
        green-color: "#1f9d68"
        rgb-green: "31, 157, 104"
        blue-color: "#3b73c4"
        rgb-blue: "59, 115, 196"
        purple-color: "#7658e0"
        rgb-purple: "118, 88, 224"
        grey-color: "#8a8e97"
        rgb-grey: "138, 142, 151"
        yellow-color: "#c98a1d"
        rgb-yellow: "201, 138, 29"
        deep-orange-color: "#d97a2b"
        rgb-deep-orange: "217, 122, 43"
      dark: &fd_dark
        primary-color: "#78a0dc"
        accent-color: "#c29a5e"
        rgb-primary-color: "120, 160, 220"
        rgb-accent-color: "194, 154, 94"
        primary-background-color: "#121418"
        secondary-background-color: "#121418"
        ha-section-background-color: "#23262c"
        card-background-color: "#23262c"
        primary-text-color: "#e7e8eb"
        secondary-text-color: "#a3a8b1"
        disabled-text-color: "#737882"
        divider-color: "rgba(255, 255, 255, 0.12)"
        app-header-background-color: "#23262c"
        mush-chip-background: "#30333b"
        app-header-text-color: "#e7e8eb"
        success-color: "#5dba8f"
        warning-color: "#c29a5e"
        error-color: "#e07a82"
        amber-color: "#c29a5e"
        rgb-amber: "194, 154, 94"
        orange-color: "#d98c5f"
        rgb-orange: "217, 140, 95"
        red-color: "#e07a82"
        rgb-red: "224, 122, 130"
        green-color: "#5dba8f"
        rgb-green: "93, 186, 143"
        blue-color: "#78a0dc"
        rgb-blue: "120, 160, 220"
        purple-color: "#a394e3"
        rgb-purple: "163, 148, 227"
        grey-color: "#7d828c"
        rgb-grey: "125, 130, 140"
        yellow-color: "#c29a5e"
        rgb-yellow: "194, 154, 94"
        deep-orange-color: "#d98c5f"
        rgb-deep-orange: "217, 140, 95"

  # Section variant: identical palette, cards render as subtle grey chips.
  family_dashboard_chips:
    ha-section-border-radius: "20px"
    ha-card-border-width: "0px"
    ha-card-box-shadow: "none"
    modes:
      light: &fc_light
        primary-color: "#3b73c4"
        accent-color: "#c98a1d"
        rgb-primary-color: "59, 115, 196"
        rgb-accent-color: "201, 138, 29"
        primary-background-color: "#e6e9ee"
        secondary-background-color: "#e6e9ee"
        ha-section-background-color: "#ffffff"
        card-background-color: "#f1f3f6"
        primary-text-color: "#15171c"
        secondary-text-color: "#5b5f68"
        disabled-text-color: "#8a8e97"
        divider-color: "rgba(15, 17, 21, 0.13)"
        app-header-background-color: "#ffffff"
        mush-chip-background: "#f1f3f6"
        app-header-text-color: "#15171c"
        success-color: "#1f9d68"
        warning-color: "#c98a1d"
        error-color: "#d1404b"
        amber-color: "#c98a1d"
        rgb-amber: "201, 138, 29"
        orange-color: "#d97a2b"
        rgb-orange: "217, 122, 43"
        red-color: "#d1404b"
        rgb-red: "209, 64, 75"
        green-color: "#1f9d68"
        rgb-green: "31, 157, 104"
        blue-color: "#3b73c4"
        rgb-blue: "59, 115, 196"
        purple-color: "#7658e0"
        rgb-purple: "118, 88, 224"
        grey-color: "#8a8e97"
        rgb-grey: "138, 142, 151"
        yellow-color: "#c98a1d"
        rgb-yellow: "201, 138, 29"
        deep-orange-color: "#d97a2b"
        rgb-deep-orange: "217, 122, 43"
      dark: &fc_dark
        primary-color: "#78a0dc"
        accent-color: "#c29a5e"
        rgb-primary-color: "120, 160, 220"
        rgb-accent-color: "194, 154, 94"
        primary-background-color: "#121418"
        secondary-background-color: "#121418"
        ha-section-background-color: "#23262c"
        card-background-color: "#30333b"
        primary-text-color: "#e7e8eb"
        secondary-text-color: "#a3a8b1"
        disabled-text-color: "#737882"
        divider-color: "rgba(255, 255, 255, 0.12)"
        app-header-background-color: "#23262c"
        mush-chip-background: "#30333b"
        app-header-text-color: "#e7e8eb"
        success-color: "#5dba8f"
        warning-color: "#c29a5e"
        error-color: "#e07a82"
        amber-color: "#c29a5e"
        rgb-amber: "194, 154, 94"
        orange-color: "#d98c5f"
        rgb-orange: "217, 140, 95"
        red-color: "#e07a82"
        rgb-red: "224, 122, 130"
        green-color: "#5dba8f"
        rgb-green: "93, 186, 143"
        blue-color: "#78a0dc"
        rgb-blue: "120, 160, 220"
        purple-color: "#a394e3"
        rgb-purple: "163, 148, 227"
        grey-color: "#7d828c"
        rgb-grey: "125, 130, 140"
        yellow-color: "#c29a5e"
        rgb-yellow: "194, 154, 94"
        deep-orange-color: "#d98c5f"
        rgb-deep-orange: "217, 140, 95"

  # Playground themes (not used by the Home Dashboard). Lift: one elevation
  # rule for every card (same fill, same soft shadow), a coloured top bar, accent
  # headings, squarer tile icons and bolder tile names. The chip theme names
  # point at the same definition so the copied Office view keeps working.
  # Section panels have no shadow or blur variable in the frontend; only cards
  # do (checked against the frontend source).
  playground_lift: &lift
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light:
        <<: *fd_light
        primary-color: "#2f6fd6"
        blue-color: "#2f6fd6"
        rgb-primary-color: "47, 111, 214"
        rgb-blue: "47, 111, 214"
        lovelace-background: "linear-gradient(160deg, #e6edf9 0%, #d2def1 100%)"
        primary-background-color: "#dce5f3"
        secondary-background-color: "#dce5f3"
        ha-section-background-color: "#f4f7fd"
        card-background-color: "#ffffff"
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#2f6fd6"
        ha-card-box-shadow: "0 2px 8px rgba(30, 60, 120, 0.12)"
      dark:
        <<: *fd_dark
        lovelace-background: "linear-gradient(160deg, #161b27 0%, #0d1016 100%)"
        primary-background-color: "#10131a"
        secondary-background-color: "#10131a"
        ha-section-background-color: "#1d2230"
        card-background-color: "#2a3245"
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#78a0dc"
        ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.40)"
  playground_lift_chips: *lift

  # Lift glass: Lift over a colourful gradient page with translucent panels and
  # translucent cards.
  playground_lift_glass: &lift_glass
    ha-section-border-radius: "24px"
    ha-card-border-radius: "16px"
    ha-card-border-width: "0px"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light: &lg_light
        <<: *fd_light
        primary-color: "#2f6fd6"
        blue-color: "#2f6fd6"
        rgb-primary-color: "47, 111, 214"
        rgb-blue: "47, 111, 214"
        lovelace-background: "linear-gradient(135deg, #c3d4f3 0%, #e0d3f2 50%, #f6e2d0 100%)"
        primary-background-color: "#dce5f3"
        secondary-background-color: "#dce5f3"
        ha-section-background-color: "rgba(255, 255, 255, 0.55)"
        card-background-color: "rgba(255, 255, 255, 0.85)"
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#2f6fd6"
        ha-card-box-shadow: "0 2px 8px rgba(30, 60, 120, 0.12)"
      dark: &lg_dark
        <<: *fd_dark
        lovelace-background: "linear-gradient(135deg, #121a30 0%, #1d1530 50%, #231a14 100%)"
        primary-background-color: "#10131a"
        secondary-background-color: "#10131a"
        ha-section-background-color: "rgba(35, 38, 44, 0.55)"
        card-background-color: "rgba(60, 68, 92, 0.75)"
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#78a0dc"
        ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.40)"
  playground_lift_glass_chips: *lift_glass

  # Bubble: Lift plus Bubble Card theme variables (names verified at v3.4.3).
  # Bubble Card ignores --ha-card-background, --ha-card-box-shadow and
  # --ha-card-border-radius, so the first four bubble-* keys copy them.
  # The modes repeat the Lift overrides because that theme's modes carry no
  # anchor; re-sync them when Lift changes. Needs the anchors *lift, *fd_light
  # and *fd_dark from this file.
  playground_bubble: &bubble
    <<: *lift
    bubble-border-radius: "16px"
    bubble-icon-border-radius: "14px"
    bubble-sub-button-border-radius: "12px"
    bubble-main-background-color: "var(--card-background-color)"
    bubble-box-shadow: "var(--ha-card-box-shadow)"
    bubble-line-background-color: "var(--divider-color)"
    ha-tile-info-primary-font-size: "13px"
    ha-tile-info-secondary-font-size: "12px"
    mush-card-primary-font-size: "13px"
    mush-card-secondary-font-size: "12px"
    modes:
      light:
        <<: *fd_light
        primary-color: "#2f6fd6"
        blue-color: "#2f6fd6"
        rgb-primary-color: "47, 111, 214"
        rgb-blue: "47, 111, 214"
        lovelace-background: "linear-gradient(160deg, #e6edf9 0%, #d2def1 100%)"
        primary-background-color: "#dce5f3"
        secondary-background-color: "#dce5f3"
        ha-section-background-color: "#f4f7fd"
        card-background-color: "#ffffff"
        app-header-background-color: "#2f6fd6"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#2f6fd6"
        ha-card-box-shadow: "0 2px 8px rgba(30, 60, 120, 0.12)"
        bubble-secondary-background-color: "rgba(47, 111, 214, 0.10)"
        bubble-accent-color: "#d97a2b"
      dark:
        <<: *fd_dark
        lovelace-background: "linear-gradient(160deg, #161b27 0%, #0d1016 100%)"
        primary-background-color: "#10131a"
        secondary-background-color: "#10131a"
        ha-section-background-color: "#1d2230"
        card-background-color: "#2a3245"
        app-header-background-color: "#2c4a80"
        app-header-text-color: "#ffffff"
        ha-heading-card-subtitle-color: "#78a0dc"
        ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.40)"
        bubble-secondary-background-color: "rgba(120, 160, 220, 0.16)"
        bubble-accent-color: "#9c4a1a"

  # Bubble focus: Bubble with a number-first tile, for the one section that
  # holds the large outside temperature tile (a section theme applies to every
  # card in the section; Bubble Card ignores the tile font variables).
  playground_bubble_focus:
    <<: *bubble
    ha-tile-info-primary-font-size: "15px"
    ha-tile-info-secondary-font-size: "56px"
    ha-tile-info-secondary-font-weight: "700"
    ha-tile-info-secondary-line-height: "1.1"

  # Worlds (M3): stronger glass. The *_focus variant is set on the one section that holds
  # only the large temperature tile, because a section theme applies to every card in it.
  # Translucent cards with a heavier blur and a
  # fine light edge on a gradient page, no section panels.
  playground_worlds: &worlds
    ha-section-border-radius: "26px"
    ha-card-border-radius: "22px"
    ha-card-border-width: "1px"
    ha-card-backdrop-filter: "blur(18px) saturate(1.4)"
    ha-tile-icon-border-radius: "14px"
    ha-tile-info-primary-font-weight: "600"
    ha-heading-card-subtitle-font-weight: "700"
    modes:
      light:
        <<: *lg_light
        card-background-color: "rgba(255, 255, 255, 0.62)"
        ha-card-border-color: "rgba(255, 255, 255, 0.85)"
        ha-card-box-shadow: "0 8px 24px rgba(58, 99, 224, 0.14)"
      dark:
        <<: *lg_dark
        card-background-color: "rgba(22, 28, 60, 0.58)"
        ha-card-border-color: "rgba(255, 255, 255, 0.12)"
        ha-card-box-shadow: "0 10px 28px rgba(0, 0, 0, 0.45)"
  playground_worlds_focus:
    <<: *worlds
    ha-tile-info-primary-font-size: "15px"
    ha-tile-info-secondary-font-size: "56px"
    ha-tile-info-secondary-font-weight: "700"
    ha-tile-info-secondary-line-height: "1.1"
