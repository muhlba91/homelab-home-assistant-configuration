---
name: Verify

on:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homeassistant:
    runs-on: ubuntu-latest
    name: Verify Home Assistant Configuration
    strategy:
      max-parallel: 6
      matrix:
        home-assistant-version:
          - stable
          - beta
          - dev
        site:
          - vie

    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - run: |
          mkdir tmp
          ./lifecycle/configuration.sh tmp . ${{ matrix.site }} || [ $? -eq 1 ]
          ./lifecycle/prepare.sh tmp . || [ $? -eq 1 ]

      - uses: frenck/action-home-assistant@941d5d917f4c1c7a7e7d4087526daf90d53f4437 # v1.4.1
        with:
          path: ./tmp
          secrets: .ci/secrets.yaml
          env_file: .ci/env
          version: "${{ matrix.home-assistant-version }}"
