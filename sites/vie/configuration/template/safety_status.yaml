          {% if is_state('binary_sensor.ass5_smoke_detected', 'on') %}Smoke detected
          {% elif is_state('binary_sensor.ffs2_water_leak_detected', 'on') %}Water leak
          {% elif is_state('binary_sensor.ring_rcs2', 'on') %}Storage window open
          {% else %}All clear{% endif %}
