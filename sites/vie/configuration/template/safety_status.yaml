---
# Safety status sensors: one for the whole house (Overview) and one per room
# tab. Each drives one status pill: red when on (alarm), orange when off but
# the summary is not exactly "All clear" (attention), green otherwise.
# The house sensor reads the lists in group/safety.yaml; room sensors list
# their own entities. See DASHBOARD.md, "Safety status sensors".
- binary_sensor:
    - unique_id: 7cdb286b-e59f-4b23-9d4c-a2021288fae3
      name: "House: Safety Status"
      default_entity_id: binary_sensor.house_safety_status
      device_class: safety
      # The entity lists live in group/safety.yaml. An empty group means a
      # configuration error: the pill then says so in orange instead of
      # reporting "All clear" while checking nothing.
      state: >-
        {{ is_state('alarm_control_panel.ring_control_panel', 'triggered')
        or expand('group.safety_smoke_detectors', 'group.safety_water_leak_sensors')
        | selectattr('state', 'eq', 'on') | list | count > 0 }}
      icon: >-
        {% if is_state('alarm_control_panel.ring_control_panel', 'triggered')
        or expand('group.safety_smoke_detectors', 'group.safety_water_leak_sensors')
        | selectattr('state', 'eq', 'on') | list | count > 0 %}mdi:alert
        {% elif (expand('group.safety_smoke_detectors') | count == 0
        or expand('group.safety_water_leak_sensors') | count == 0
        or expand('group.safety_doors_and_windows') | count == 0) %}mdi:shield-alert-outline
        {% elif expand('group.safety_doors_and_windows') | selectattr('state', 'eq', 'on') | list | count > 0 %}mdi:door-open
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% set smoke = expand('group.safety_smoke_detectors') | selectattr('state', 'eq', 'on') | list | count %}
          {% set leak = expand('group.safety_water_leak_sensors') | selectattr('state', 'eq', 'on') | list | count %}
          {% set open = expand('group.safety_doors_and_windows') | selectattr('state', 'eq', 'on') | list | count %}
          {% if is_state('alarm_control_panel.ring_control_panel', 'triggered') %}Alarm triggered
          {% elif smoke > 0 %}Smoke detected
          {% elif leak > 0 %}Water leak
          {% elif (expand('group.safety_smoke_detectors') | count == 0
          or expand('group.safety_water_leak_sensors') | count == 0
          or expand('group.safety_doors_and_windows') | count == 0) %}Safety groups missing
          {% elif open > 0 %}{{ open }} door/window open
          {% else %}All clear{% endif %}
    - unique_id: 2cff670b-7153-4bfe-94b7-70fec563ff31
      name: "Living Room: Safety Status"
      default_entity_id: binary_sensor.living_room_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass3_smoke_detected', 'binary_sensor.ffs1_water_alarm_water_leak_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass3_smoke_detected', 'binary_sensor.ffs1_water_alarm_water_leak_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% elif ['binary_sensor.ring_rcs3'] | select('is_state', 'on') | list | count > 0 %}mdi:door-open
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass3_smoke_detected', 'on') %}Smoke detected
          {% elif is_state('binary_sensor.ffs1_water_alarm_water_leak_detected', 'on') %}Water leak (kitchen)
          {% elif is_state('binary_sensor.ring_rcs3', 'on') %}Garden door open
          {% else %}All clear{% endif %}
    - unique_id: 5d0e9f0a-3a41-4f7e-9d0b-0f6c1f5e2a11
      name: "Office: Safety Status"
      default_entity_id: binary_sensor.office_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass1_smoke_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass1_smoke_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass1_smoke_detected', 'on') %}Smoke detected
          {% else %}All clear{% endif %}
    - unique_id: b2a6c0e4-8f1d-4c5a-9e2b-6d7f3a1c9e22
      name: "Tea Room: Safety Status"
      default_entity_id: binary_sensor.tea_room_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass6_smoke_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass6_smoke_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass6_smoke_detected', 'on') %}Smoke detected
          {% else %}All clear{% endif %}
    - unique_id: e7c3d91b-2b6a-4f0e-8a5c-3f9d1e6b7c33
      name: "Bedroom: Safety Status"
      default_entity_id: binary_sensor.bedroom_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass2_smoke_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass2_smoke_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass2_smoke_detected', 'on') %}Smoke detected
          {% else %}All clear{% endif %}
    - unique_id: 9a4f2c6e-7d3b-4e1a-b8c5-2e6f0d9a1b44
      name: "Hallways: Safety Status"
      default_entity_id: binary_sensor.hallways_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass7_smoke_detected', 'binary_sensor.ass4_smoke_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass7_smoke_detected', 'binary_sensor.ass4_smoke_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% elif ['binary_sensor.ring_rcs1'] | select('is_state', 'on') | list | count > 0 %}mdi:door-open
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass7_smoke_detected', 'on') %}Smoke detected (hallway)
          {% elif is_state('binary_sensor.ass4_smoke_detected', 'on') %}Smoke detected (entrance)
          {% elif is_state('binary_sensor.ring_rcs1', 'on') %}Front door open
          {% else %}All clear{% endif %}
    - unique_id: c1e8b5d2-6f4a-4b9e-a3d7-8e2c5f0b1d55
      name: "Utility: Safety Status"
      default_entity_id: binary_sensor.utility_safety_status
      device_class: safety
      state: >-
        {{ ['binary_sensor.ass5_smoke_detected', 'binary_sensor.ffs2_water_leak_detected'] | select('is_state', 'on') | list | count > 0 }}
      icon: >-
        {% if ['binary_sensor.ass5_smoke_detected', 'binary_sensor.ffs2_water_leak_detected'] | select('is_state', 'on') | list | count > 0 %}mdi:alert
        {% elif ['binary_sensor.ring_rcs2'] | select('is_state', 'on') | list | count > 0 %}mdi:door-open
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ass5_smoke_detected', 'on') %}Smoke detected
          {% elif is_state('binary_sensor.ffs2_water_leak_detected', 'on') %}Water leak
          {% elif is_state('binary_sensor.ring_rcs2', 'on') %}Storage window open
          {% else %}All clear{% endif %}
    - unique_id: 3f7a1d2e-9b4c-4e8f-a6d1-5c2b8e9f0a66
      name: "Bathrooms: Safety Status"
      default_entity_id: binary_sensor.bathrooms_safety_status
      device_class: safety
      state: >-
        {{ is_state('binary_sensor.fms1_home_security_motion_detection', 'on')
        and is_state('alarm_control_panel.ring_control_panel', 'armed_away') }}
      icon: >-
        {% if is_state('binary_sensor.fms1_home_security_motion_detection', 'on')
        and is_state('alarm_control_panel.ring_control_panel', 'armed_away') %}mdi:alert
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.fms1_home_security_motion_detection', 'on')
          and is_state('alarm_control_panel.ring_control_panel', 'armed_away') %}Motion while armed
          {% else %}All clear{% endif %}
    - unique_id: 9a404b8c-f781-437e-bffd-3ed55b658200
      name: "Garden: Safety Status"
      default_entity_id: binary_sensor.garden_safety_status
      device_class: safety
      state: >-
        {{ false }}
      icon: >-
        {% if is_state('binary_sensor.ring_rcs3', 'on') %}mdi:door-open
        {% else %}mdi:shield-check{% endif %}
      attributes:
        summary: >-
          {% if is_state('binary_sensor.ring_rcs3', 'on') %}Garden door open
          {% else %}All clear{% endif %}
