---
- alias: "Living Room: Media System: Denon Off -> Projector Off"
  triggers:
    - trigger: state
      entity_id: media_player.denon_avr_x1500h
      to: "off"
  conditions: []
  actions:
    - action: remote.turn_on
      target:
        entity_id: remote.living_room_projector
    - delay:
        seconds: 1
    - action: script.turn_on
      target:
        entity_id: script.living_room_media_system_power_off
  mode: single
