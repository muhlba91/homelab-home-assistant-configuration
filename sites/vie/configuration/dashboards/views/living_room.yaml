---
title: Living Room
path: living-room
icon: mdi:sofa
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    title: Climate & Lighting
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: climate.living_room_air_conditioner
        name: Air Conditioner
        features:
          - type: climate-hvac-modes
            style: icons
          - type: target-temperature
        grid_options:
          columns: 12
      - type: custom:modern-circular-gauge
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.living_room_living_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fds1_1
        name: Living Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs12_1
        name: Kitchen
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Shutters
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: cover.living_room_kitchen
        name: Kitchen
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12
      - type: tile
        entity: cover.garden_door
        name: Garden Door
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12
      - type: tile
        entity: cover.living_room_tv
        name: TV
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    title: Media System
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: switch.living_room_media_system
        name: Media System
        icon: mdi:power
        color: purple
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Safety
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: binary_sensor.ass3_smoke_detected
        name: Smoke
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ffs1_water_alarm_water_leak_detected
        name: Kitchen leak
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.living_room_ring_motion_sensor
        name: Motion
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ring_rcs3
        name: Garden door
        grid_options:
          columns: 9

  - type: grid
    title: Camera & Vacuum
    background: true
    column_span: 3
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.living_room_living_room_fluent
        card_id: living_room_camera
        grid_options:
          columns: 24
      - type: tile
        entity: vacuum.tea_room_roborock
        name: Roborock
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - return_home
              - locate
        grid_options:
          columns: 12

  - type: grid
    title: Battery Levels
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: sensor.ass3_battery
        name: Smoke
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.living_room_living_room_temperature_humidity_battery
        name: Climate sensor
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.living_room_ring_motion_sensor_battery
        name: Motion
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.ffs1_battery_level
        name: Kitchen leak
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.ring_rcs3_garden_door_battery
        name: Garden door
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.tea_room_roborock_battery
        name: Roborock
        grid_options:
          columns: 9
