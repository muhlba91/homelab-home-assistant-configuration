---
title: Living Room
path: living-room
icon: mdi:sofa
cards:
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-climate-card
        entity: climate.living_room_air_conditioner
        show_temperature_control: true
        collapsible_controls: true
      - type: custom:modern-circular-gauge
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.living_room_living_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Lighting
          - type: custom:mushroom-switch-card
            entity: switch.fds1_1
            name: Living Room
            icon: mdi:lightbulb
            icon_color: amber
          - type: custom:mushroom-switch-card
            entity: switch.fs12_1
            name: Kitchen
            icon: mdi:lightbulb
            icon_color: amber
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Shutters
      - type: custom:bubble-card
        card_type: cover
        entity: cover.living_room_kitchen
        name: Kitchen Shutter
      - type: custom:bubble-card
        card_type: cover
        entity: cover.garden_door
        name: Garden Door Shutter
      - type: custom:bubble-card
        card_type: cover
        entity: cover.living_room_tv
        name: TV Shutter
  - type: custom:mushroom-switch-card
    entity: switch.living_room_media_system
    name: Media System
    icon: mdi:power
    icon_color: purple
    layout: horizontal
    secondary_info: >-
      {{ 'Denon AVR · projector syncs automatically' }}
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Safety
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.ass3_smoke_detected
            name: Smoke
            icon: mdi:smoke-detector
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.ass3_smoke_detected', 'on') else 'green' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.ffs1_water_alarm_water_leak_detected
            name: Kitchen leak
            icon: mdi:water-alert
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.ffs1_water_alarm_water_leak_detected', 'on') else 'green' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.living_room_ring_motion_sensor
            name: Motion
            icon: mdi:motion-sensor
          - type: custom:mushroom-entity-card
            entity: binary_sensor.ring_rcs3
            name: Garden door
            icon: mdi:door
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.living_room_living_room_fluent
        card_id: living-room-camera
      - type: custom:mushroom-vacuum-card
        entity: vacuum.tea_room_roborock
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Battery Levels
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ass3_battery
            name: LR Smoke
          - type: custom:mushroom-entity-card
            entity: sensor.living_room_living_room_temperature_humidity_battery
            name: LR Sensor
          - type: custom:mushroom-entity-card
            entity: sensor.living_room_ring_motion_sensor_battery
            name: LR Motion
          - type: custom:mushroom-entity-card
            entity: sensor.ffs1_battery_level
            name: Kitchen Leak
          - type: custom:mushroom-entity-card
            entity: sensor.ring_rcs3_garden_door_battery
            name: Garden Door
          - type: custom:mushroom-entity-card
            entity: sensor.tea_room_roborock_battery
            name: Roborock
