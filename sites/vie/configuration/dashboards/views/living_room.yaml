---
title: Living Room
path: living-room
icon: mdi:sofa
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: LIGHTING
        heading_style: subtitle
      - type: tile
        entity: switch.fds1_1
        name: Living Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full
      - type: tile
        entity: switch.fs12_1
        name: Kitchen
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: AIR CONDITIONER
        heading_style: subtitle
      - type: tile
        entity: climate.living_room_air_conditioner
        name: Living Room
        features:
          - type: climate-hvac-modes
            style: icons
          - type: climate-fan-modes
            style: dropdown
          - type: target-temperature
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: CLIMATE
        heading_style: subtitle
      - type: tile
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: Temperature
        icon: mdi:thermometer
        color: blue
        features:
          - type: trend-graph
            hours_to_show: 24
            detail: false
        grid_options:
          columns: full
      - type: tile
        entity: sensor.living_room_living_room_temperature_humidity_humidity
        name: Humidity
        icon: mdi:water-percent
        color: green
        features:
          - type: trend-graph
            hours_to_show: 24
            detail: false
        grid_options:
          columns: full

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SHUTTERS
        heading_style: subtitle
      - type: tile
        entity: cover.living_room_kitchen
        name: Kitchen
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12
      - type: tile
        entity: cover.garden_door
        name: Garden Door
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12
      - type: tile
        entity: cover.living_room_tv
        name: TV
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: MEDIA SYSTEM
        heading_style: subtitle
      - type: tile
        entity: switch.living_room_media_system
        name: Media System
        icon: mdi:television-play
        color: purple
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: VACUUM
        heading_style: subtitle
      - type: tile
        entity: vacuum.tea_room_roborock
        name: Roborock
        features_position: inline
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - return_home
        grid_options:
          columns: full

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SAFETY
        heading_style: subtitle
        grid_options:
          columns: 27
      - type: custom:mushroom-chips-card
        alignment: end
        chips:
          - type: template
            entity: binary_sensor.living_room_safety_status
            content: "{{ state_attr('binary_sensor.living_room_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.living_room_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.living_room_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.living_room_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ass3_smoke_detected
        name: Smoke
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ffs1_water_alarm_water_leak_detected
        name: Kitchen leak
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.living_room_ring_motion_sensor
        name: Motion
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ring_rcs3
        name: Garden door
        grid_options:
          columns: 9

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: BATTERY LEVELS
        heading_style: subtitle
      - type: tile
        entity: sensor.ass3_battery
        name: Smoke
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.living_room_living_room_temperature_humidity_battery
        name: Climate
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.living_room_ring_motion_sensor_battery
        name: Motion
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ffs1_battery_level
        name: Kitchen leak
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ring_rcs3_garden_door_battery
        name: Garden door
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.tea_room_roborock_battery
        name: Roborock
        grid_options:
          columns: 6
