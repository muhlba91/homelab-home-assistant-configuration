---
title: Overview
path: overview
icon: mdi:home
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: SECURITY & SAFETY
        heading_style: subtitle
        badges:
          - type: entity
            entity: binary_sensor.house_safety_status
            show_state: true
            state_content: summary
            color: state
      - type: tile
        entity: alarm_control_panel.ring_control_panel
        name: Alarm
        grid_options:
          columns: 12
      - type: tile
        entity: lock.entrance_door_lock
        name: Front Door
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        primary: Smoke
        secondary: >-
          {% set ids = ['binary_sensor.ass1_smoke_detected', 'binary_sensor.ass2_smoke_detected', 'binary_sensor.ass3_smoke_detected', 'binary_sensor.ass4_smoke_detected', 'binary_sensor.ass5_smoke_detected', 'binary_sensor.ass6_smoke_detected', 'binary_sensor.ass7_smoke_detected'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'All clear (' ~ ids | count ~ ')' if on == 0 else on ~ ' triggered!' }}
        icon: mdi:smoke-detector
        icon_color: >-
          {% set ids = ['binary_sensor.ass1_smoke_detected', 'binary_sensor.ass2_smoke_detected', 'binary_sensor.ass3_smoke_detected', 'binary_sensor.ass4_smoke_detected', 'binary_sensor.ass5_smoke_detected', 'binary_sensor.ass6_smoke_detected', 'binary_sensor.ass7_smoke_detected'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'red' }}
        grid_options:
          columns: 8
      - type: custom:mushroom-template-card
        primary: Water leaks
        secondary: >-
          {% set ids = ['binary_sensor.ffs1_water_alarm_water_leak_detected', 'binary_sensor.ffs2_water_leak_detected'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'Dry (' ~ ids | count ~ ')' if on == 0 else on ~ ' wet!' }}
        icon: mdi:water-alert
        icon_color: >-
          {% set ids = ['binary_sensor.ffs1_water_alarm_water_leak_detected', 'binary_sensor.ffs2_water_leak_detected'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'red' }}
        grid_options:
          columns: 8
      - type: custom:mushroom-template-card
        primary: Doors & windows
        secondary: >-
          {% set ids = ['binary_sensor.ring_rcs1', 'binary_sensor.ring_rcs2', 'binary_sensor.ring_rcs3'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'All closed (' ~ ids | count ~ ')' if on == 0 else on ~ ' open' }}
        icon: mdi:door-open
        icon_color: >-
          {% set ids = ['binary_sensor.ring_rcs1', 'binary_sensor.ring_rcs2', 'binary_sensor.ring_rcs3'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'amber' }}
        grid_options:
          columns: 8

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: OUTDOOR (FORECAST)
        heading_style: subtitle
      - type: tile
        entity: weather.home
        name: Outdoor
        state_content:
          - state
          - temperature
        grid_options:
          columns: full
      - type: tile
        entity: weather.home
        name: Humidity
        icon: mdi:water-percent
        state_content: humidity
        grid_options:
          columns: 4
      - type: tile
        entity: weather.home
        name: Pressure
        icon: mdi:gauge
        state_content: pressure
        grid_options:
          columns: 4
      - type: tile
        entity: weather.home
        name: Wind
        icon: mdi:weather-windy
        state_content: wind_speed
        grid_options:
          columns: 4

  - type: grid
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: INDOOR CLIMATE
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: Living Room
        min: 15
        max: 28
        secondary:
          entity: sensor.living_room_living_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        tertiary:
          entity: climate.living_room_air_conditioner
          state_text: "{{ 'AC ' ~ (states('climate.living_room_air_conditioner') | replace('_', ' ') | title) }}"
          show_unit: false
          state_font_size: 8
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.bedroom_bedroom_temperature_humidity_temperature
        name: Bedroom
        min: 15
        max: 28
        secondary:
          entity: sensor.bedroom_bedroom_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        tertiary:
          entity: climate.bedroom_air_conditioner
          state_text: "{{ 'AC ' ~ (states('climate.bedroom_air_conditioner') | replace('_', ' ') | title) }}"
          show_unit: false
          state_font_size: 8
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.office_office_temperature_humidity_temperature
        name: Office
        min: 15
        max: 28
        secondary:
          entity: sensor.office_office_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        tertiary:
          entity: climate.office_air_conditioner
          state_text: "{{ 'AC ' ~ (states('climate.office_air_conditioner') | replace('_', ' ') | title) }}"
          show_unit: false
          state_font_size: 8
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.tea_room_tea_room_temperature_humidity_temperature
        name: Tea Room
        min: 15
        max: 28
        secondary:
          entity: sensor.tea_room_tea_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        grid_options:
          columns: 6
          rows: 3

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: WEATHER STATION
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp1
        name: South
        min: 5
        max: 35
        secondary:
          entity: sensor.ecowitt_humidity1
          show_gauge: outer
          min: 20
          max: 80
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp2
        name: North
        min: 5
        max: 35
        secondary:
          entity: sensor.ecowitt_humidity2
          show_gauge: outer
          min: 20
          max: 80
        grid_options:
          columns: 6
          rows: 3

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.pv_power_photovoltaics_fronius_power_flow
        name: Solar power
        min: 0
        max: 5000
        grid_options:
          columns: 12
          rows: 3
      - type: tile
        entity: sensor.pv_energy_day_fronius_power_flow
        name: Produced today
        icon: mdi:solar-power
        color: amber
        grid_options:
          columns: 24
      - type: tile
        entity: sensor.energy_meter_po
        name: Exporting to grid
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 24
      - type: tile
        entity: sensor.energy_meter_p
        name: Importing from grid
        icon: mdi:transmission-tower-import
        grid_options:
          columns: 24

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: ENERGY FLOW
        heading_style: subtitle
      - type: custom:sankey-chart
        show_names: true
        height: 160
        nodes:
          - id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 0
            name: Solar
            color: var(--warning-color)
          - id: sensor.energy_meter_p
            section: 0
            name: Grid import
          - id: sensor.energy_meter_po
            section: 1
            name: Grid export
            color: var(--success-color)
          - id: house_consumption
            entity_id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 1
            name: House
            add_entities:
              - sensor.energy_meter_p
            subtract_entities:
              - sensor.energy_meter_po
        links:
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: sensor.energy_meter_po
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: house_consumption
          - source: sensor.energy_meter_p
            target: house_consumption
        grid_options:
          columns: full
