---
title: Overview
path: overview
icon: mdi:home
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: SECURITY & SAFETY
        heading_style: subtitle
        grid_options:
          columns: 16
      - type: custom:mushroom-chips-card
        alignment: end
        chips:
          - type: template
            entity: binary_sensor.house_safety_status
            content: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.house_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.house_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: 8
      - type: tile
        entity: alarm_control_panel.ring_control_panel
        name: Alarm
        grid_options:
          columns: 12
      - type: tile
        entity: lock.entrance_door_lock
        name: Front Door
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        primary: Smoke
        secondary: >-
          {% set ids = ['binary_sensor.ass1_smoke_detected', 'binary_sensor.ass2_smoke_detected', 'binary_sensor.ass3_smoke_detected', 'binary_sensor.ass4_smoke_detected', 'binary_sensor.ass5_smoke_detected', 'binary_sensor.ass6_smoke_detected', 'binary_sensor.ass7_smoke_detected'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'All clear (' ~ ids | count ~ ')' if on == 0 else on ~ ' triggered!' }}
        icon: mdi:smoke-detector
        icon_color: >-
          {% set ids = ['binary_sensor.ass1_smoke_detected', 'binary_sensor.ass2_smoke_detected', 'binary_sensor.ass3_smoke_detected', 'binary_sensor.ass4_smoke_detected', 'binary_sensor.ass5_smoke_detected', 'binary_sensor.ass6_smoke_detected', 'binary_sensor.ass7_smoke_detected'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'red' }}
        grid_options:
          columns: 8
      - type: custom:mushroom-template-card
        primary: Water leaks
        secondary: >-
          {% set ids = ['binary_sensor.ffs1_water_alarm_water_leak_detected', 'binary_sensor.ffs2_water_leak_detected'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'Dry (' ~ ids | count ~ ')' if on == 0 else on ~ ' wet!' }}
        icon: mdi:water-alert
        icon_color: >-
          {% set ids = ['binary_sensor.ffs1_water_alarm_water_leak_detected', 'binary_sensor.ffs2_water_leak_detected'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'red' }}
        grid_options:
          columns: 8
      - type: custom:mushroom-template-card
        primary: Doors & windows
        secondary: >-
          {% set ids = ['binary_sensor.ring_rcs1', 'binary_sensor.ring_rcs2', 'binary_sensor.ring_rcs3'] %}
          {% set on = ids | select('is_state', 'on') | list | count %}
          {{ 'All closed (' ~ ids | count ~ ')' if on == 0 else on ~ ' open' }}
        icon: mdi:door-open
        icon_color: >-
          {% set ids = ['binary_sensor.ring_rcs1', 'binary_sensor.ring_rcs2', 'binary_sensor.ring_rcs3'] %}
          {{ 'green' if ids | select('is_state', 'on') | list | count == 0 else 'orange' }}
        grid_options:
          columns: 8

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: OUTDOOR (FORECAST)
        heading_style: subtitle
        grid_options:
          columns: 6
      - type: custom:mushroom-chips-card
        alignment: end
        chips:
          - type: template
            entity: sun.sun
            icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
            icon_color: amber
            content: >-
              {% set next = state_attr('sun.sun', 'next_setting') if
              is_state('sun.sun', 'above_horizon') else
              state_attr('sun.sun', 'next_rising') %}
              {% set ts = as_timestamp(next, none) %}
              {% if ts is none %}Sun times unavailable
              {% elif is_state('sun.sun', 'above_horizon') %}Sunset {{ ts | timestamp_custom('%H:%M') }}
              {% else %}Sunrise {{ ts | timestamp_custom('%H:%M') }}{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: weather.home
        primary: >-
          {{ state_translated('weather.home') }} · {{ state_attr('weather.home', 'temperature') }}
          {{ state_attr('weather.home', 'temperature_unit') }}
        secondary: Now
        icon: >-
          {% set map = {'clear-night': 'weather-night', 'partlycloudy': 'weather-partly-cloudy',
          'exceptional': 'alert-circle-outline'} %}
          mdi:{{ map.get(states('weather.home'), 'weather-' ~ states('weather.home')) }}
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        entity: weather.home
        primary: >-
          {{ state_attr('weather.home', 'humidity') }} % ·
          {{ state_attr('weather.home', 'pressure') }} {{ state_attr('weather.home', 'pressure_unit') }} ·
          {{ state_attr('weather.home', 'wind_speed') }} {{ state_attr('weather.home', 'wind_speed_unit') }}
        secondary: Humidity · Pressure · Wind
        icon: mdi:weather-windy
        icon_color: grey
        tap_action:
          action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: INDOOR CLIMATE
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: Living Room
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.living_room_living_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.bedroom_bedroom_temperature_humidity_temperature
        name: Bedroom
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.bedroom_bedroom_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.office_office_temperature_humidity_temperature
        name: Office
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.office_office_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.tea_room_tea_room_temperature_humidity_temperature
        name: Tea Room
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.tea_room_tea_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: climate.living_room_air_conditioner
            icon: mdi:air-conditioner
            icon_color: "{{ 'grey' if is_state('climate.living_room_air_conditioner', 'off') else 'blue' }}"
            content: "{{ 'AC ' ~ (states('climate.living_room_air_conditioner') | replace('_', ' ') | title) }}"
            tap_action:
              action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: climate.bedroom_air_conditioner
            icon: mdi:air-conditioner
            icon_color: "{{ 'grey' if is_state('climate.bedroom_air_conditioner', 'off') else 'blue' }}"
            content: "{{ 'AC ' ~ (states('climate.bedroom_air_conditioner') | replace('_', ' ') | title) }}"
            tap_action:
              action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: climate.office_air_conditioner
            icon: mdi:air-conditioner
            icon_color: "{{ 'grey' if is_state('climate.office_air_conditioner', 'off') else 'blue' }}"
            content: "{{ 'AC ' ~ (states('climate.office_air_conditioner') | replace('_', ' ') | title) }}"
            tap_action:
              action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:air-conditioner
            icon_color: disabled
            content: No AC
        grid_options:
          columns: 6

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: WEATHER STATION
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp1
        name: South
        min: 5
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.ecowitt_humidity1
          show_gauge: outer
          min: 20
          max: 80
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp2
        name: North
        min: 5
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: "var(--blue-color)"
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.ecowitt_humidity2
          show_gauge: outer
          min: 20
          max: 80
          gauge_foreground_style:
            color: "var(--green-color)"
        grid_options:
          columns: 6
          rows: 3
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:thermometer-lines
            icon_color: grey
            content: >-
              {% set s = states('sensor.ecowitt_temp1') %}
              {% set n = states('sensor.ecowitt_temp2') %}
              {% if not (s | is_number and n | is_number) %}Sensors unavailable
              {% elif s | float >= n | float %}South +{{ (s | float - n | float) | round(1) }} °C
              {% else %}North +{{ (n | float - s | float) | round(1) }} °C{% endif %}
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - type: custom:modern-circular-gauge
        entity: sensor.pv_power_photovoltaics_fronius_power_flow
        name: Solar power
        min: 0
        max: 5000
        show_icon: false
        gauge_foreground_style:
          color: "var(--amber-color)"
        gauge_background_style:
          color: var(--divider-color)
        grid_options:
          columns: 12
          rows: 3
      - type: tile
        entity: sensor.pv_energy_day_fronius_power_flow
        name: Produced today
        icon: mdi:solar-power
        color: amber
        grid_options:
          columns: 24
      - type: tile
        entity: sensor.energy_meter_po
        name: Exporting to grid
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 24
      - type: tile
        entity: sensor.energy_meter_p
        name: Importing from grid
        icon: mdi:transmission-tower-import
        color: red
        grid_options:
          columns: 24

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: ENERGY FLOW
        heading_style: subtitle
      - type: custom:sankey-chart
        show_names: true
        height: 160
        nodes:
          - id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 0
            name: Solar
            color: var(--amber-color)
          - id: sensor.energy_meter_p
            section: 0
            name: Grid import
            color: var(--red-color)
          - id: sensor.energy_meter_po
            section: 1
            name: Grid export
            color: var(--green-color)
          - id: house_consumption
            entity_id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 1
            name: House
            color: var(--blue-color)
            add_entities:
              - sensor.energy_meter_p
            subtract_entities:
              - sensor.energy_meter_po
        links:
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: sensor.energy_meter_po
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: house_consumption
          - source: sensor.energy_meter_p
            target: house_consumption
        grid_options:
          columns: full
