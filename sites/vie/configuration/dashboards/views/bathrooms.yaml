---
title: Bathrooms
path: bathrooms
icon: mdi:shower
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    title: Lighting
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: switch.fds2_2
        name: Bathroom
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fds2_1
        name: Mirror
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs1_1
        name: Toilet
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Shutters
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: cover.bathroom
        name: Bathroom
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    title: Safety
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: binary_sensor.fms1_home_security_motion_detection
        name: Toilet motion
        grid_options:
          columns: 9

  - type: grid
    title: Battery Levels
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: sensor.fms1_battery_level
        name: Toilet motion
        grid_options:
          columns: 9
