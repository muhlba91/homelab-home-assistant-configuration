---
# Bathrooms tab of the Home Dashboard (YAML is the source of truth; edit by hand).
# Section order, widths and card patterns: DASHBOARD.md, "Layout rules" and
# "Component catalogue". Validate with scripts/validate_dashboard.py.
title: Bathrooms
path: bathrooms
icon: mdi:shower
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: LIGHTING
        heading_style: subtitle
      - type: tile
        entity: switch.fds2_2
        name: Bathroom
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fds2_1
        name: Mirror
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs1_1
        name: Toilet
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: SHUTTERS
        heading_style: subtitle
      - type: tile
        entity: cover.bathroom
        name: Bathroom
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: SAFETY
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.bathrooms_safety_status
            content: "{{ state_attr('binary_sensor.bathrooms_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.bathrooms_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.bathrooms_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.bathrooms_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: tile
        entity: binary_sensor.fms1_home_security_motion_detection
        name: Toilet motion
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: BATTERY LEVELS
        heading_style: subtitle
      - type: tile
        entity: sensor.fms1_battery_level
        name: Toilet motion
        grid_options:
          columns: 6
