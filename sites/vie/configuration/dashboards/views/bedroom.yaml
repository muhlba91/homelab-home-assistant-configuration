---
title: Bedroom
path: bedroom
icon: mdi:bed
cards:
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-climate-card
        entity: climate.bedroom_air_conditioner
        show_temperature_control: true
        collapsible_controls: true
      - type: custom:modern-circular-gauge
        entity: sensor.bedroom_bedroom_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.bedroom_bedroom_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: custom:mushroom-switch-card
        entity: switch.fs6_1
        name: Bedroom Light
        icon: mdi:lightbulb
        icon_color: amber
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Shutter
      - type: custom:bubble-card
        card_type: cover
        entity: cover.bedroom
        name: Bedroom Shutter
  - type: custom:mushroom-entity-card
    entity: binary_sensor.ass2_smoke_detected
    name: Smoke
    icon: mdi:smoke-detector
    icon_color: >-
      {{ 'red' if is_state('binary_sensor.ass2_smoke_detected', 'on') else 'green' }}
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Battery Levels
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ass2_battery
            name: Bedroom Smoke
          - type: custom:mushroom-entity-card
            entity: sensor.bedroom_bedroom_temperature_humidity_battery
            name: Bedroom T&H Sensor
