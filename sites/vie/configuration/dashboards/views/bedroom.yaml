---
title: Bedroom
path: bedroom
icon: mdi:bed
type: sections
sections:
  - type: grid
    title: Climate & Lighting
    background: true
    cards:
      - type: custom:mushroom-climate-card
        entity: climate.bedroom_air_conditioner
        show_temperature_control: true
        collapsible_controls: true
      - type: custom:modern-circular-gauge
        entity: sensor.bedroom_bedroom_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.bedroom_bedroom_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: tile
        entity: switch.fs6_1
        name: Bedroom Light
        icon: mdi:lightbulb
        features:
          - type: toggle

  - type: grid
    title: Shutter
    background: true
    cards:
      - type: tile
        entity: cover.bedroom
        name: Bedroom Shutter
        features:
          - type: cover-open-close
          - type: cover-position

  - type: grid
    title: Safety
    background: true
    cards:
      - type: tile
        entity: binary_sensor.ass2_smoke_detected
        name: Smoke

  - type: grid
    title: Battery Levels
    background: true
    cards:
      - type: tile
        entity: sensor.ass2_battery
        name: Bedroom Smoke
      - type: tile
        entity: sensor.bedroom_bedroom_temperature_humidity_battery
        name: Bedroom T&H Sensor
