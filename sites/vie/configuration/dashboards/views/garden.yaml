---
title: Garden
path: garden
icon: mdi:tree
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    title: Lighting
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: switch.fds4_2
        name: Pergola
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Weather Station
    background: true
    column_span: 3
    cards:
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp1
        name: South
        min: 5
        max: 35
        secondary:
          entity: sensor.ecowitt_humidity1
          show_gauge: outer
          min: 20
          max: 80
        grid_options:
          columns: 12
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp2
        name: North
        min: 5
        max: 35
        secondary:
          entity: sensor.ecowitt_humidity2
          show_gauge: outer
          min: 20
          max: 80
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        primary: Difference
        secondary: >-
          {% set diff = (states('sensor.ecowitt_temp1') | float(0)) -
          (states('sensor.ecowitt_temp2') | float(0)) %}
          {{ 'South +' ~ diff | round(1) ~ ' °C' if diff >= 0
          else 'North +' ~ (-diff) | round(1) ~ ' °C' }}
        icon: mdi:thermometer-lines
        grid_options:
          columns: 12

  - type: grid
    title: Battery Levels
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: binary_sensor.ecowitt_batt1
        name: South sensor
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ecowitt_batt2
        name: North sensor
        grid_options:
          columns: 9
