---
title: Hallways
path: hallways
icon: mdi:door
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: LIGHTING
        heading_style: subtitle
      - type: tile
        entity: switch.fs4_1
        name: Hallway
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fds1_2
        name: Hallway 2
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs2_1
        name: Entrance
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: FRONT DOOR
        heading_style: subtitle
      - type: tile
        entity: lock.entrance_door_lock
        name: Front Door
        features_position: inline
        features:
          - type: lock-commands
        grid_options:
          columns: full
      - type: tile
        entity: switch.alarm_keypad_chirps
        name: Keypad chirps
        icon: mdi:bell-ring
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full
      - type: tile
        entity: switch.presence_simulation
        name: Presence simulation
        icon: mdi:account-clock
        color: purple
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: SAFETY
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.hallways_safety_status
            content: "{{ state_attr('binary_sensor.hallways_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.hallways_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.hallways_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.hallways_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: tile
        entity: binary_sensor.ass7_smoke_detected
        name: Hallway smoke
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.ass4_smoke_detected
        name: Entrance smoke
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.ring_rcs1
        name: Front door
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.ring_rms1
        name: Ring motion
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.fms2_home_security_motion_detection
        name: Fibaro motion
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: BATTERY LEVELS
        heading_style: subtitle
      - type: tile
        entity: sensor.ass7_battery
        name: Hallway smoke
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ass4_battery
        name: Entrance smoke
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ring_rcs1_front_door_battery
        name: Front door
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ring_rms1_entrance_room_battery
        name: Ring motion
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.fms2_battery_level
        name: Fibaro motion
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ring_keypad_battery
        name: Keypad
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.entrance_room_entrance_door_lock_battery
        name: Door lock
        grid_options:
          columns: 6
