---
title: Hallways
path: hallways
icon: mdi:door
type: sections
sections:
  - type: grid
    title: Lighting
    background: true
    cards:
      - type: tile
        entity: switch.fs4_1
        name: Hallway Light
        icon: mdi:lightbulb
        features:
          - type: toggle
      - type: tile
        entity: switch.fds1_2
        name: Hallway Light 2
        icon: mdi:lightbulb
        features:
          - type: toggle
      - type: tile
        entity: switch.fs2_1
        name: Entrance Room Light
        icon: mdi:lightbulb
        features:
          - type: toggle

  - type: grid
    title: Front Door
    background: true
    cards:
      - type: custom:mushroom-lock-card
        entity: lock.entrance_door_lock
        icon_color: green
      - type: tile
        entity: switch.alarm_keypad_chirps
        name: Ring Keypad Chirps
        icon: mdi:bell-ring
        features:
          - type: toggle

  - type: grid
    title: Safety
    background: true
    cards:
      - type: tile
        entity: binary_sensor.ass7_smoke_detected
        name: Hallway smoke
      - type: tile
        entity: binary_sensor.ass4_smoke_detected
        name: Entrance smoke
      - type: tile
        entity: binary_sensor.ring_rms1
        name: Entrance motion (Ring)
      - type: tile
        entity: binary_sensor.fms2_home_security_motion_detection
        name: Entrance motion (Fibaro)

  - type: grid
    title: Battery Levels
    background: true
    cards:
      - type: tile
        entity: sensor.ass7_battery
        name: Hallway Smoke
      - type: tile
        entity: sensor.ass4_battery
        name: Entrance Smoke
      - type: tile
        entity: sensor.ring_rms1_entrance_room_battery
        name: Entrance Motion (Ring)
      - type: tile
        entity: sensor.fms2_battery_level
        name: Entrance Motion (Fibaro)
      - type: tile
        entity: sensor.ring_keypad_battery
        name: Ring Keypad
      - type: tile
        entity: sensor.entrance_room_entrance_door_lock_battery
        name: Door Lock
