---
title: Office
path: office
icon: mdi:briefcase
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    title: Climate & Lighting
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: climate.office_air_conditioner
        name: Air Conditioner
        features:
          - type: climate-hvac-modes
            style: icons
          - type: target-temperature
        grid_options:
          columns: 12
      - type: custom:modern-circular-gauge
        entity: sensor.office_office_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.office_office_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs7_1
        name: Office
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Shutters
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: cover.office
        name: Office
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    title: Safety
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: binary_sensor.ass1_smoke_detected
        name: Smoke
        grid_options:
          columns: 9

  - type: grid
    title: Battery Levels
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: sensor.ass1_battery
        name: Smoke
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.office_office_temperature_humidity_battery
        name: Climate sensor
        grid_options:
          columns: 9
