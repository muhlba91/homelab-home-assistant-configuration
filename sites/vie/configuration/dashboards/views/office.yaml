---
title: Office
path: office
icon: mdi:briefcase
type: sections
sections:
  - type: grid
    title: Climate & Lighting
    background: true
    cards:
      - type: custom:mushroom-climate-card
        entity: climate.office_air_conditioner
        show_temperature_control: true
        collapsible_controls: true
      - type: custom:modern-circular-gauge
        entity: sensor.office_office_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.office_office_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: tile
        entity: switch.fs7_1
        name: Office Light
        icon: mdi:lightbulb
        features:
          - type: toggle

  - type: grid
    title: Shutter
    background: true
    cards:
      - type: tile
        entity: cover.office
        name: Office Shutter
        features:
          - type: cover-open-close
          - type: cover-position
          - type: cover-tilt-position

  - type: grid
    title: Safety
    background: true
    cards:
      - type: tile
        entity: binary_sensor.ass1_smoke_detected
        name: Smoke

  - type: grid
    title: Battery Levels
    background: true
    cards:
      - type: tile
        entity: sensor.ass1_battery
        name: Office Smoke
      - type: tile
        entity: sensor.office_office_temperature_humidity_battery
        name: Office T&H Sensor
