---
title: Tea Room
path: tea-room
icon: mdi:tea
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:modern-circular-gauge
        entity: sensor.tea_room_tea_room_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.tea_room_tea_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: custom:mushroom-switch-card
        entity: switch.fs5_1
        name: Tea Room Light
        icon: mdi:lightbulb
        icon_color: amber
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Shutter
      - type: custom:bubble-card
        card_type: cover
        entity: cover.tea_room
        name: Tea Room Shutter
  - type: custom:mushroom-entity-card
    entity: binary_sensor.ass6_smoke_detected
    name: Smoke
    icon: mdi:smoke-detector
    icon_color: >-
      {{ 'red' if is_state('binary_sensor.ass6_smoke_detected', 'on') else 'green' }}
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Battery Levels
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ass6_battery
            name: Tea Room Smoke
          - type: custom:mushroom-entity-card
            entity: sensor.tea_room_tea_room_temperature_humidity_battery
            name: Tea Room T&H Sensor
