---
title: Tea Room
path: tea-room
icon: mdi:tea
type: sections
sections:
  - type: grid
    title: Climate & Lighting
    background: true
    cards:
      - type: custom:modern-circular-gauge
        entity: sensor.tea_room_tea_room_temperature_humidity_temperature
        name: Climate
        min: 15
        max: 28
        secondary:
          entity: sensor.tea_room_tea_room_temperature_humidity_humidity
          show_gauge: outer
          min: 30
          max: 70
      - type: tile
        entity: switch.fs5_1
        name: Tea Room Light
        icon: mdi:lightbulb
        features:
          - type: toggle

  - type: grid
    title: Shutter
    background: true
    cards:
      - type: tile
        entity: cover.tea_room
        name: Tea Room Shutter
        features:
          - type: cover-open-close
          - type: cover-position
          - type: cover-tilt-position

  - type: grid
    title: Safety
    background: true
    cards:
      - type: tile
        entity: binary_sensor.ass6_smoke_detected
        name: Smoke

  - type: grid
    title: Battery Levels
    background: true
    cards:
      - type: tile
        entity: sensor.ass6_battery
        name: Tea Room Smoke
      - type: tile
        entity: sensor.tea_room_tea_room_temperature_humidity_battery
        name: Tea Room T&H Sensor
