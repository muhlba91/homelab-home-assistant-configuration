---
title: Utility
path: utility
icon: mdi:washing-machine
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: LIGHTING
        heading_style: subtitle
      - type: tile
        entity: switch.fs10_1
        name: Utility Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs3_1
        name: Storage Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: WASHING MACHINE
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: sensor.washing_machine_status
            content: "{{ states('sensor.washing_machine_status') }}"
            icon: "{{ state_attr('sensor.washing_machine_status', 'icon') }}"
            icon_color: "{{ state_attr('sensor.washing_machine_status', 'color') }}"
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
              - condition: state
                entity: sensor.washing_machine_end_time
                state_not: unknown
            chip:
              type: template
              icon: mdi:clock-outline
              icon_color: grey
              content: "Done at {{ as_timestamp(states('sensor.washing_machine_end_time')) | timestamp_custom('%H:%M') }}"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
              - condition: state
                entity: sensor.lg_washer_temperature
                state_not: unknown
            chip:
              type: template
              icon: mdi:thermometer
              icon_color: grey
              content: "{{ states('sensor.lg_washer_temperature') | int }} °C"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
              - condition: state
                entity: sensor.lg_washer_spin
                state_not: unknown
            chip:
              type: template
              icon: mdi:autorenew
              icon_color: grey
              content: "{{ states('sensor.lg_washer_spin') | int }} rpm"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
            chip:
              type: template
              icon: mdi:washing-machine
              icon_color: grey
              content: "{{ states('sensor.lg_washer_course') }}"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
              - condition: state
                entity: binary_sensor.lg_washer_pre_wash
                state: "on"
            chip:
              type: template
              icon: mdi:water-sync
              icon_color: grey
              content: Pre-wash
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.washing_machine_active
                state: "on"
              - condition: state
                entity: binary_sensor.lg_washer_intensive_wash
                state: "on"
            chip:
              type: template
              icon: mdi:washing-machine-alert
              icon_color: grey
              content: Intensive
        grid_options:
          columns: full

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: SHUTTERS
        heading_style: subtitle
      - type: tile
        entity: cover.storage_room
        name: Storage Room
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: SAFETY
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.utility_safety_status
            content: "{{ state_attr('binary_sensor.utility_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.utility_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.utility_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.utility_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: tile
        entity: binary_sensor.ass5_smoke_detected
        name: Smoke
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.ffs2_water_leak_detected
        name: Leak
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.fms3_home_security_motion_detection
        name: Storage motion
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.ring_rcs2
        name: Storage window
        grid_options:
          columns: 12

  - type: grid
    theme: family_dashboard_chips
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: BATTERY LEVELS
        heading_style: subtitle
      - type: tile
        entity: sensor.fms3_battery_level
        name: Storage motion
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ring_rcs2_front_window_battery
        name: Storage window
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ffs2_battery_level
        name: Leak
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.ass5_battery
        name: Smoke
        grid_options:
          columns: 6
