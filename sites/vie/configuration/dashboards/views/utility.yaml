---
title: Utility
path: utility
icon: mdi:washing-machine
theme: family_dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    title: Lighting
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: switch.fs10_1
        name: Utility Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12
      - type: tile
        entity: switch.fs3_1
        name: Storage Room
        icon: mdi:lightbulb
        color: amber
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: 12

  - type: grid
    title: Shutters
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: cover.storage_room
        name: Storage Room
        color: blue
        features_position: inline
        features:
          - type: cover-open-close
        grid_options:
          columns: 12

  - type: grid
    title: Safety
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: binary_sensor.ass5_smoke_detected
        name: Smoke
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ffs2_water_leak_detected
        name: Leak
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.fms3_home_security_motion_detection
        name: Storage motion
        grid_options:
          columns: 9
      - type: tile
        entity: binary_sensor.ring_rcs2
        name: Storage window
        grid_options:
          columns: 9

  - type: grid
    title: Battery Levels
    background: true
    column_span: 3
    cards:
      - type: tile
        entity: sensor.fms3_battery_level
        name: Storage motion
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.ring_rcs2_front_window_battery
        name: Storage window
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.ffs2_battery_level
        name: Leak
        grid_options:
          columns: 9
      - type: tile
        entity: sensor.ass5_battery
        name: Smoke
        grid_options:
          columns: 9
