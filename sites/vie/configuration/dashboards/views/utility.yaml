---
title: Utility
path: utility
icon: mdi:washing-machine
type: sections
sections:
  - type: grid
    title: Lighting
    background: true
    cards:
      - type: tile
        entity: switch.fs10_1
        name: Utility Room Light
        icon: mdi:lightbulb
        features:
          - type: toggle
      - type: tile
        entity: switch.fs3_1
        name: Storage Room Light
        icon: mdi:lightbulb
        features:
          - type: toggle

  - type: grid
    title: Storage Room Shutter
    background: true
    cards:
      - type: tile
        entity: cover.storage_room
        name: Storage Room Shutter
        features:
          - type: cover-open-close
          - type: cover-position

  - type: grid
    title: Safety
    background: true
    cards:
      - type: tile
        entity: binary_sensor.ass5_smoke_detected
        name: Utility smoke
      - type: tile
        entity: binary_sensor.ffs2_water_leak_detected
        name: Utility leak
      - type: tile
        entity: binary_sensor.fms3_home_security_motion_detection
        name: Storage motion
      - type: tile
        entity: binary_sensor.ring_rcs2
        name: Storage window

  - type: grid
    title: Battery Levels
    background: true
    cards:
      - type: tile
        entity: sensor.fms3_battery_level
        name: Storage Motion
      - type: tile
        entity: sensor.ring_rcs2_front_window_battery
        name: Storage Window
      - type: tile
        entity: sensor.ffs2_battery_level
        name: Utility Leak
      - type: tile
        entity: sensor.ass5_battery
        name: Utility Smoke
