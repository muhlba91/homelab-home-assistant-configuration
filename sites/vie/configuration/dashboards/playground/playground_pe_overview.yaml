# Playground variant "pe_overview": Hero tab with a picture-elements weather card as the focal point.
# Generator: scratchpad/tracks/pe/gen_pe.py. Not validated by scripts/validate_dashboard.py.
title: PE Overview
path: pe_overview
icon: mdi:image-filter-hdr
theme: playground_lift
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      color: red
      opacity: 18
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.house_safety_status
        state_not: "off"
    cards:
      - type: heading
        heading: NEEDS ATTENTION
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: binary_sensor.house_safety_status
        primary: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
        secondary: Tap for details
        icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
        icon_color: "{{ 'red' if is_state('binary_sensor.house_safety_status', 'on') else 'orange' }}"
        tap_action:
          action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      color: purple
      opacity: 25
    column_span: 3
    visibility:
      - condition: state
        entity: switch.presence_simulation
        state: "on"
    cards:
      - type: heading
        heading: PRESENCE SIMULATION
        heading_style: subtitle
      - type: tile
        entity: switch.presence_simulation
        name: Presence simulation is on
        icon: mdi:account-clock
        color: purple
        state_content:
          - state
          - last_changed
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    background:
      color: blue
      opacity: 12
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - &hero_status
        type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.house_safety_status
            content: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.house_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.house_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: alarm_control_panel.ring_control_panel
            content: "Alarm {{ states('alarm_control_panel.ring_control_panel') | replace('_', ' ') }}"
            icon: "{{ 'mdi:shield-off-outline' if is_state('alarm_control_panel.ring_control_panel', 'disarmed') else 'mdi:shield-lock' }}"
            icon_color: "{{ 'grey' if is_state('alarm_control_panel.ring_control_panel', 'disarmed') else 'green' }}"
            tap_action:
              action: more-info
          - type: template
            entity: lock.entrance_door_lock
            content: "Front door {{ states('lock.entrance_door_lock') }}"
            icon: "{{ 'mdi:lock' if is_state('lock.entrance_door_lock', 'locked') else 'mdi:lock-open-variant' }}"
            icon_color: "{{ 'green' if is_state('lock.entrance_door_lock', 'locked') else 'orange' }}"
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: picture-elements
        aspect_ratio: "3.4:1"
        entity: weather.home
        state_image:
          sunny: &pe_d_sun "data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%2029.41%27%20preserveAspectRatio=%27none%27%3E%3Cdefs%3E%3CradialGradient%20id=%27a%27%20cx=%27.16%27%20cy=%27.38%27%20r=%27.55%27%3E%3Cstop%20offset=%270%27%20stop-color=%27rgb%28245,166,35%29%27%20stop-opacity=%270.3%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27rgb%28245,166,35%29%27%20stop-opacity=%270%27/%3E%3C/radialGradient%3E%3CradialGradient%20id=%27b%27%20cx=%27.9%27%20cy=%271%27%20r=%27.5%27%3E%3Cstop%20offset=%270%27%20stop-color=%27rgb%28245,166,35%29%27%20stop-opacity=%270.12%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27rgb%28245,166,35%29%27%20stop-opacity=%270%27/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width=%27100%27%20height=%2729.41%27%20fill=%27url%28%23a%29%27/%3E%3Crect%20width=%27100%27%20height=%2729.41%27%20fill=%27url%28%23b%29%27/%3E%3C/svg%3E"
