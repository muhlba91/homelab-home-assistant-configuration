                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 2.7cqw, 40px)"
                  font-weight: 600
                  color: var(--primary-text-color)
              - type: icon
                entity: weather.home
                icon: mdi:water-percent
                style:
                  left: 63%
                  top: 22.1%
                  "--mdc-icon-size": "clamp(18px, 3.4cqw, 48px)"
                  color: var(--secondary-text-color)
              - type: icon
                entity: weather.home
                icon: mdi:gauge
                style:
                  left: 63%
                  top: 49.98%
                  "--mdc-icon-size": "clamp(18px, 3.4cqw, 48px)"
                  color: var(--secondary-text-color)
              - type: icon
                entity: weather.home
                icon: mdi:weather-windy
                style:
                  left: 63%
                  top: 77.86%
                  "--mdc-icon-size": "clamp(18px, 3.4cqw, 48px)"
                  color: var(--secondary-text-color)
        grid_options:
          columns: full
      - &hero_fc_chips
        type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: sun.sun
            icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
            icon_color: amber
            content: >-
              {% set next = state_attr('sun.sun', 'next_setting') if
              is_state('sun.sun', 'above_horizon') else
              state_attr('sun.sun', 'next_rising') %}
              {% set ts = as_timestamp(next, none) %}
              {% if ts is none %}Sun times unavailable
              {% elif is_state('sun.sun', 'above_horizon') %}Sunset {{ ts | timestamp_custom('%H:%M') }}
              {% else %}Sunrise {{ ts | timestamp_custom('%H:%M') }}{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: weather.home
            icon: >-
              {{ 'mdi:clock-alert-outline' if is_state('binary_sensor.weather_data_stale', 'on') else 'mdi:clock-outline' }}
            icon_color: "{{ 'orange' if is_state('binary_sensor.weather_data_stale', 'on') else 'grey' }}"
            content: >-
              {% set u = states('sensor.weather_updated') %}
              {% if u in ['unknown', 'unavailable'] %}Weather unavailable
              {% else %}{% set d = as_local(as_datetime(u)) %}Updated {{ d.strftime('%H:%M') if d.date() == now().date() else d.strftime('%a %H:%M') }}{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: 24

