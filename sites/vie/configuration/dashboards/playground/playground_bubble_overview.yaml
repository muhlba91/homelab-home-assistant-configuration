  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Weather Station
        icon: mdi:thermometer-lines
        grid_options:
          columns: full
      - type: custom:bubble-card
