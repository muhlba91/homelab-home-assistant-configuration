# Playground variant "bubble_overview": the Hero tab rebuilt with Bubble Card v3.4.3 (built-in options and
# theme variables only: no styles key, no modules). Not validated by scripts/validate_dashboard.py.
# Needs the theme entries playground_bubble and playground_bubble_focus. See DASHBOARD.md, "Playground dashboard".
title: Bubble Overview
path: bubble_overview
icon: mdi:chat-processing-outline
theme: playground_bubble
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      color: red
      opacity: 18
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.house_safety_status
        state_not: "off"
    cards:
      - type: heading
        heading: NEEDS ATTENTION
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: binary_sensor.house_safety_status
        primary: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
        secondary: Tap for details
        icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
        icon_color: "{{ 'red' if is_state('binary_sensor.house_safety_status', 'on') else 'orange' }}"
        tap_action:
          action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      color: purple
      opacity: 25
    column_span: 3
    visibility:
      - condition: state
        entity: switch.presence_simulation
        state: "on"
    cards:
      - type: heading
        heading: PRESENCE SIMULATION
        heading_style: subtitle
      - type: tile
        entity: switch.presence_simulation
        name: Presence simulation is on
        icon: mdi:account-clock
        color: purple
        state_content:
          - state
          - last_changed
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    background:
      color: blue
      opacity: 12
    theme: playground_bubble_focus
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - &bub_status
        type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: binary_sensor.house_safety_status
        name: >-
          {{ 'Everything is fine' if state_attr('binary_sensor.house_safety_status', 'summary') == 'All clear'
          else state_attr('binary_sensor.house_safety_status', 'summary') }}
        icon: >-
          {{ 'mdi:shield-check' if state_attr('binary_sensor.house_safety_status', 'summary') == 'All clear'
          else state_attr('binary_sensor.house_safety_status', 'icon') }}
        state_content: >-
          Alarm {{ states('alarm_control_panel.ring_control_panel') | replace('_', ' ') }}
          · Front door {{ states('lock.entrance_door_lock') }}
        button_action:
          tap_action:
            action: more-info
        tap_action:
          action: more-info
        sub_button:
          main:
            - entity: lock.entrance_door_lock
              name: Front door unlocked
              icon: mdi:lock-open-variant
              show_name: true
              visibility:
                - condition: state
                  entity: lock.entrance_door_lock
                  state: unlocked
          bottom: []
        grid_options:
          columns: 24
          rows: 1
      - type: clock
        clock_style: digital
        clock_size: small
        no_background: true
        date_format:
          - weekday-long
          - day-numeric
          - month-long
        grid_options:
          columns: 12
          rows: 1
      - type: tile
        entity: weather.home
        name: Outside
        color: blue
        state_content:
          - temperature
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 3
      - &bub_weather
        type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.weather_today_high
        name: "{{ state_translated('weather.home') }}"
        icon: >-
          {% set map = {'clear-night': 'weather-night', 'partlycloudy': 'weather-partly-cloudy',
          'exceptional': 'alert-circle-outline'} %}
          mdi:{{ map.get(states('weather.home'), 'weather-' ~ states('weather.home')) }}
        state_content: >-
          {% set lo = states('sensor.weather_today_low') %}
          {% set hi = states('sensor.weather_today_high') %}
          {% if lo | is_number and hi | is_number %}Today ↓{{ lo | float | round(0) | int }}° ↑{{ hi | float | round(0) | int }}°{% else %}Today's range unavailable{% endif %}
        button_action:
          tap_action:
            action: more-info
            entity: weather.home
        tap_action:
          action: more-info
          entity: weather.home
        sub_button:
          main: []
          bottom:
            - group:
                - &pill_humidity
                  entity: weather.home
                  icon: mdi:water-percent
                  state_content: "Humidity {{ state_attr('weather.home', 'humidity') }} %"
                  state_background: false
                  tap_action:
                    action: more-info
                - &pill_pressure
                  entity: weather.home
                  icon: mdi:gauge
                  state_content: "Pressure {{ state_attr('weather.home', 'pressure') }} {{ state_attr('weather.home', 'pressure_unit') }}"
                  state_background: false
                  tap_action:
                    action: more-info
                - &pill_wind
                  entity: weather.home
                  icon: mdi:weather-windy
                  state_content: "Wind {{ state_attr('weather.home', 'wind_speed') }} {{ state_attr('weather.home', 'wind_speed_unit') }}"
                  state_background: false
                  tap_action:
                    action: more-info
              buttons_layout: inline
            - group:
                - &pill_sun
                  entity: sun.sun
                  icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
                  state_content: >-
                    {% set next = state_attr('sun.sun', 'next_setting') if
                    is_state('sun.sun', 'above_horizon') else
                    state_attr('sun.sun', 'next_rising') %}
                    {% set ts = as_timestamp(next, none) %}
                    {% if ts is none %}Sun times unavailable
                    {% elif is_state('sun.sun', 'above_horizon') %}Sunset {{ ts | timestamp_custom('%H:%M') }}
                    {% else %}Sunrise {{ ts | timestamp_custom('%H:%M') }}{% endif %}
                  state_background: false
                  tap_action:
                    action: more-info
                - &pill_updated
                  entity: binary_sensor.weather_data_stale
                  icon: >-
                    {{ 'mdi:clock-alert-outline' if is_state('binary_sensor.weather_data_stale', 'on') else 'mdi:clock-outline' }}
                  state_content: >-
                    {% set u = states('sensor.weather_updated') %}
                    {% if u in ['unknown', 'unavailable'] %}Weather unavailable
                    {% else %}{% set d = as_local(as_datetime(u)) %}Updated {{ d.strftime('%H:%M') if d.date() == now().date() else d.strftime('%a %H:%M') }}{% endif %}
                  tap_action:
                    action: more-info
                    entity: weather.home
              buttons_layout: inline
          bottom_layout: rows
        grid_options:
          columns: 24
          rows: 3

  - type: grid
    background:
      color: blue
      opacity: 12
    theme: playground_bubble_focus
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(max-width: 899px)"
    cards:
      - <<: *bub_status
        grid_options:
          columns: 12
          rows: 1
      - type: tile
        entity: weather.home
        name: Outside
        color: blue
        state_content:
          - temperature
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 3
      - <<: *bub_weather
        sub_button:
          main: []
          bottom:
            - group:
                - *pill_humidity
                - *pill_wind
              buttons_layout: inline
            - group:
                - *pill_pressure
              buttons_layout: inline
            - group:
                - *pill_sun
                - *pill_updated
              buttons_layout: inline
          bottom_layout: rows
        grid_options:
          columns: 12
          rows: 4

