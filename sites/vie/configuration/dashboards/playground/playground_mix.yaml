# Playground variant "mix" (generated by the playground generator): a redesign of the Overview tab.
# Not validated by scripts/validate_dashboard.py. See DASHBOARD.md, "Playground dashboard".
title: Mix
path: mix
icon: mdi:view-dashboard-variant-outline
theme: playground_mix
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      color: red
      opacity: 18
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.house_safety_status
        state_not: "off"
    cards:
      - type: heading
        heading: NEEDS ATTENTION
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: binary_sensor.house_safety_status
        primary: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
        secondary: Tap for details
        icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
        icon_color: "{{ 'red' if is_state('binary_sensor.house_safety_status', 'on') else 'orange' }}"
        tap_action:
          action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      color: purple
      opacity: 25
    column_span: 3
    visibility:
      - condition: state
        entity: switch.presence_simulation
        state: "on"
    cards:
      - type: heading
        heading: PRESENCE SIMULATION
        heading_style: subtitle
      - type: tile
        entity: switch.presence_simulation
        name: Presence simulation is on
        icon: mdi:account-clock
        color: purple
        state_content:
          - state
          - last_changed
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.washing_machine_active
        state: "on"
    cards:
      - type: heading
        heading: WASHING MACHINE
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.washing_machine_status
        primary: Washing machine
        secondary: "{{ state_attr('sensor.washing_machine_status', 'overview') }}"
        icon: "{{ state_attr('sensor.washing_machine_status', 'icon') }}"
        icon_color: "{{ state_attr('sensor.washing_machine_status', 'color') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/utility
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - &status_sentence
        type: custom:mushroom-template-card
        entity: binary_sensor.house_safety_status
        primary: >-
          {{ 'Everything is fine' if is_state('binary_sensor.house_safety_status', 'off') else state_attr('binary_sensor.house_safety_status', 'summary') }}
        secondary: >-
          {{ state_translated('weather.home') }} {{ state_attr('weather.home', 'temperature') | round(1) }} °C outside · {{ states('sensor.living_room_living_room_temperature_humidity_temperature') | float(0) | round(1) }} °C in the living room
        icon: "{{ 'mdi:shield-check' if is_state('binary_sensor.house_safety_status', 'off') else state_attr('binary_sensor.house_safety_status', 'icon') }}"
        icon_color: >-
          {% if is_state('binary_sensor.house_safety_status', 'on') %}red{% elif state_attr('binary_sensor.house_safety_status', 'summary') != 'All clear' %}orange{% else %}green{% endif %}
        tap_action:
          action: more-info
        grid_options:
          columns: 20
          rows: 2
      - &status_pills
        type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: alarm_control_panel.ring_control_panel
            content: "Alarm {{ states('alarm_control_panel.ring_control_panel') | replace('_', ' ') }}"
            icon: "{{ 'mdi:shield-off-outline' if is_state('alarm_control_panel.ring_control_panel', 'disarmed') else 'mdi:shield-lock' }}"
            icon_color: "{{ 'grey' if is_state('alarm_control_panel.ring_control_panel', 'disarmed') else 'green' }}"
            tap_action:
              action: more-info
          - type: template
            entity: lock.entrance_door_lock
            content: "Front door {{ states('lock.entrance_door_lock') }}"
            icon: "{{ 'mdi:lock' if is_state('lock.entrance_door_lock', 'locked') else 'mdi:lock-open-variant' }}"
            icon_color: "{{ 'green' if is_state('lock.entrance_door_lock', 'locked') else 'orange' }}"
            tap_action:
              action: more-info
          - type: template
            entity: sun.sun
            icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
            icon_color: amber
            content: >-
              {% set next = state_attr('sun.sun', 'next_setting') if
              is_state('sun.sun', 'above_horizon') else
              state_attr('sun.sun', 'next_rising') %}
              {% set ts = as_timestamp(next, none) %}
              {% if ts is none %}Sun times unavailable
              {% elif is_state('sun.sun', 'above_horizon') %}Sunset {{ ts | timestamp_custom('%H:%M') }}
              {% else %}Sunrise {{ ts | timestamp_custom('%H:%M') }}{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: weather.home
            icon: >-
              {{ 'mdi:clock-alert-outline' if is_state('binary_sensor.weather_data_stale', 'on') else 'mdi:clock-outline' }}
            icon_color: "{{ 'orange' if is_state('binary_sensor.weather_data_stale', 'on') else 'grey' }}"
            content: >-
              {% set u = states('sensor.weather_updated') %}
              {% if u in ['unknown', 'unavailable'] %}Weather unavailable
              {% else %}{% set d = as_local(as_datetime(u)) %}Updated {{ d.strftime('%H:%M') if d.date() == now().date() else d.strftime('%a %H:%M') }}{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: 16
          rows: 2

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(max-width: 899px)"
    cards:
      - <<: *status_sentence
        grid_options:
          columns: 12
          rows: 2
      - <<: *status_pills
        grid_options:
          columns: 12
          rows: 2

  - type: grid
    background:
      opacity: 100
    theme: playground_mix_focus
    column_span: 1
    cards:
      - type: tile
        entity: weather.home
        name: Outside
        color: blue
        state_content:
          - temperature
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 3

  - type: grid
    background:
      opacity: 100
    row_span: 2
    column_span: 2
    cards:
      - type: heading
        heading: INSIDE
        heading_style: subtitle
      - &room_living_room
        type: custom:mushroom-template-card
        entity: binary_sensor.living_room_safety_status
        primary: Living Room
        secondary: |-
          {% set t = states('sensor.living_room_living_room_temperature_humidity_temperature') | float(0) %}{% set s = state_attr('binary_sensor.living_room_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}{{ t | round(1) }} °C · {{ states('sensor.living_room_living_room_temperature_humidity_humidity') | float(0) | round(0) | int }} %
          {{ 'Cool' if t < 19 else ('Warm' if t > 24 else 'Comfortable') }}{% endif %}
        multiline_secondary: true
        icon: mdi:sofa
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.living_room_safety_status', 'on') else ('orange' if state_attr('binary_sensor.living_room_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/living_room
        grid_options:
          columns: 6
          rows: 3
      - &room_office
        type: custom:mushroom-template-card
        entity: binary_sensor.office_safety_status
        primary: Office
        secondary: |-
          {% set t = states('sensor.office_office_temperature_humidity_temperature') | float(0) %}{% set s = state_attr('binary_sensor.office_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}{{ t | round(1) }} °C · {{ states('sensor.office_office_temperature_humidity_humidity') | float(0) | round(0) | int }} %
          {{ 'Cool' if t < 19 else ('Warm' if t > 24 else 'Comfortable') }}{% endif %}
        multiline_secondary: true
        icon: mdi:desk
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.office_safety_status', 'on') else ('orange' if state_attr('binary_sensor.office_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/office
        grid_options:
          columns: 6
          rows: 3
      - &room_tea_room
        type: custom:mushroom-template-card
        entity: binary_sensor.tea_room_safety_status
        primary: Tea Room
        secondary: |-
          {% set t = states('sensor.tea_room_tea_room_temperature_humidity_temperature') | float(0) %}{% set s = state_attr('binary_sensor.tea_room_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}{{ t | round(1) }} °C · {{ states('sensor.tea_room_tea_room_temperature_humidity_humidity') | float(0) | round(0) | int }} %
          {{ 'Cool' if t < 19 else ('Warm' if t > 24 else 'Comfortable') }}{% endif %}
        multiline_secondary: true
        icon: mdi:tea
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.tea_room_safety_status', 'on') else ('orange' if state_attr('binary_sensor.tea_room_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/tea_room
        grid_options:
          columns: 6
          rows: 3
      - &room_bedroom
        type: custom:mushroom-template-card
        entity: binary_sensor.bedroom_safety_status
        primary: Bedroom
        secondary: |-
          {% set t = states('sensor.bedroom_bedroom_temperature_humidity_temperature') | float(0) %}{% set s = state_attr('binary_sensor.bedroom_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}{{ t | round(1) }} °C · {{ states('sensor.bedroom_bedroom_temperature_humidity_humidity') | float(0) | round(0) | int }} %
          {{ 'Cool' if t < 19 else ('Warm' if t > 24 else 'Comfortable') }}{% endif %}
        multiline_secondary: true
        icon: mdi:bed
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.bedroom_safety_status', 'on') else ('orange' if state_attr('binary_sensor.bedroom_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/bedroom
        grid_options:
          columns: 6
          rows: 3
      - &room_bathrooms
        type: custom:mushroom-template-card
        entity: binary_sensor.bathrooms_safety_status
        primary: Bathrooms
        secondary: >-
          {% set s = state_attr('binary_sensor.bathrooms_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}All fine{% endif %}
        multiline_secondary: true
        icon: mdi:shower
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.bathrooms_safety_status', 'on') else ('orange' if state_attr('binary_sensor.bathrooms_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/bathrooms
        grid_options:
          columns: 6
          rows: 3
      - &room_hallways
        type: custom:mushroom-template-card
        entity: binary_sensor.hallways_safety_status
        primary: Hallways
        secondary: >-
          {% set s = state_attr('binary_sensor.hallways_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}All fine{% endif %}
        multiline_secondary: true
        icon: mdi:door
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.hallways_safety_status', 'on') else ('orange' if state_attr('binary_sensor.hallways_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/hallways
        grid_options:
          columns: 6
          rows: 3
      - &room_garden
        type: custom:mushroom-template-card
        entity: binary_sensor.garden_safety_status
        primary: Garden
        secondary: >-
          {% set s = state_attr('binary_sensor.garden_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}South {{ states('sensor.ecowitt_temp1') | float(0) | round(1) }} °C · North {{ states('sensor.ecowitt_temp2') | float(0) | round(1) }} °C{% endif %}
        multiline_secondary: true
        icon: mdi:tree
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.garden_safety_status', 'on') else ('orange' if state_attr('binary_sensor.garden_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/garden
        grid_options:
          columns: 6
          rows: 3
      - &room_utility
        type: custom:mushroom-template-card
        entity: binary_sensor.utility_safety_status
        primary: Utility
        secondary: >-
          {% set s = state_attr('binary_sensor.utility_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% elif is_state('binary_sensor.washing_machine_active', 'on') %}{{ state_attr('sensor.washing_machine_status', 'overview') }}{% else %}All fine{% endif %}
        multiline_secondary: true
        icon: mdi:washing-machine
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.utility_safety_status', 'on') else ('orange' if state_attr('binary_sensor.utility_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/utility
        grid_options:
          columns: 6
          rows: 3

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: OUTSIDE
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.weather_today_high
        primary: >-
          {% set lo = states('sensor.weather_today_low') %}{% set hi = states('sensor.weather_today_high') %}{% if lo | is_number and hi | is_number %}{{ lo | float | round(0) | int }}° to {{ hi | float | round(0) | int }}°{% else %}n/a{% endif %}
        secondary: Today
        icon: mdi:thermometer
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: weather.home
        primary: >-
          {{ state_attr('weather.home', 'humidity') }} %
        secondary: Humidity
        icon: mdi:water-percent
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: weather.home
        primary: >-
          {{ state_attr('weather.home', 'pressure') }} {{ state_attr('weather.home', 'pressure_unit') }}
        secondary: Pressure
        icon: mdi:gauge
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: weather.home
        primary: >-
          {{ state_attr('weather.home', 'wind_speed') }} {{ state_attr('weather.home', 'wind_speed_unit') }}
        secondary: Wind
        icon: mdi:weather-windy
        icon_color: grey
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: sensor.ecowitt_temp1
        primary: >-
          {{ states('sensor.ecowitt_temp1') | float(0) | round(1) }} °C
        secondary: Garden south
        icon: mdi:thermometer
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: sensor.ecowitt_temp2
        primary: >-
          {{ states('sensor.ecowitt_temp2') | float(0) | round(1) }} °C
        secondary: Garden north
        icon: mdi:thermometer
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - &sol_h_now
        type: heading
        heading: NOW
        heading_style: subtitle
        grid_options:
          columns: 18
      - &sol_h_today
        type: heading
        heading: TODAY
        heading_style: subtitle
        grid_options:
          columns: 18
      - &sol_g_now
        type: custom:modern-circular-gauge
        entity: sensor.pv_power_photovoltaics_fronius_power_flow
        name: Solar
        min: 0
        max: 5000
        show_icon: false
        gauge_foreground_style:
          color: 'var(--amber-color)'
        gauge_background_style:
          color: var(--divider-color)
        grid_options:
          columns: 9
          rows: 3
      - &sol_n1
        type: tile
        entity: sensor.solar_own_use_power
        name: Own use
        icon: mdi:home-lightning-bolt
        color: amber
        grid_options:
          columns: 9
      - &sol_g_today
        type: custom:modern-circular-gauge
        entity: sensor.solar_produced_today
        name: Produced
        min: 0
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: 'var(--amber-color)'
        gauge_background_style:
          color: var(--divider-color)
        grid_options:
          columns: 9
          rows: 3
      - &sol_t1
        type: tile
        entity: sensor.solar_own_use_today
        name: Own use
        icon: mdi:home-lightning-bolt
        color: amber
        grid_options:
          columns: 9
      - &sol_n2
        type: tile
        entity: sensor.energy_meter_po
        name: Exporting
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 9
      - &sol_t2
        type: tile
        entity: sensor.grid_exported_today
        name: Exported
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 9
      - &sol_n3
        type: tile
        entity: sensor.energy_meter_p
        name: Importing
        icon: mdi:transmission-tower-import
        color: red
        grid_options:
          columns: 9
      - &sol_t3
        type: tile
        entity: sensor.grid_imported_today
        name: Imported
        icon: mdi:transmission-tower-import
        color: red
        grid_options:
          columns: 9

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(max-width: 899px)"
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - <<: *sol_h_now
        grid_options:
          columns: 12
      - <<: *sol_g_now
        grid_options:
          columns: 6
          rows: 3
      - <<: *sol_n1
        grid_options:
          columns: 6
      - <<: *sol_n2
        grid_options:
          columns: 6
      - <<: *sol_n3
        grid_options:
          columns: 6
      - <<: *sol_h_today
        grid_options:
          columns: 12
      - <<: *sol_g_today
        grid_options:
          columns: 6
          rows: 3
      - <<: *sol_t1
        grid_options:
          columns: 6
      - <<: *sol_t2
        grid_options:
          columns: 6
      - <<: *sol_t3
        grid_options:
          columns: 6

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: ENERGY FLOW
        heading_style: subtitle
      - type: custom:sankey-chart
        show_names: true
        height: 160
        nodes:
          - id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 0
            name: Solar
            color: var(--amber-color)
          - id: sensor.energy_meter_p
            section: 0
            name: Grid import
            color: var(--red-color)
          - id: sensor.energy_meter_po
            section: 1
            name: Grid export
            color: var(--green-color)
          - id: house_consumption
            entity_id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 1
            name: House
            color: var(--blue-color)
            add_entities:
              - sensor.energy_meter_p
            subtract_entities:
              - sensor.energy_meter_po
        links:
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: sensor.energy_meter_po
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: house_consumption
          - source: sensor.energy_meter_p
            target: house_consumption
        grid_options:
          columns: full
