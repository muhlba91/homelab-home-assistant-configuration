  - type: grid
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - &sol_h_now
        type: heading
        heading: NOW
        heading_style: subtitle
        grid_options:
          columns: 18
      - &sol_h_today
        type: heading
        heading: TODAY
        heading_style: subtitle
        grid_options:
          columns: 18
      - &sol_g_now
        type: custom:modern-circular-gauge
        entity: sensor.pv_power_photovoltaics_fronius_power_flow
        name: Solar
        min: 0
        max: 5000
        show_icon: false
        gauge_foreground_style:
          color: 'var(--amber-color)'
        gauge_background_style:
          color: var(--divider-color)
        grid_options:
          columns: 9
          rows: 3
      - &sol_n1
        type: tile
        entity: sensor.solar_own_use_power
        name: Own use
        icon: mdi:home-lightning-bolt
        color: amber
        grid_options:
          columns: 9
      - &sol_g_today
        type: custom:modern-circular-gauge
        entity: sensor.solar_produced_today
        name: Produced
        min: 0
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: 'var(--amber-color)'
        gauge_background_style:
          color: var(--divider-color)
        grid_options:
          columns: 9
          rows: 3
      - &sol_t1
        type: tile
        entity: sensor.solar_own_use_today
        name: Own use
        icon: mdi:home-lightning-bolt
        color: amber
        grid_options:
          columns: 9
      - &sol_n2
        type: tile
        entity: sensor.energy_meter_po
        name: Exporting
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 9
      - &sol_t2
        type: tile
        entity: sensor.grid_exported_today
        name: Exported
        icon: mdi:transmission-tower-export
        color: green
        grid_options:
          columns: 9
      - &sol_n3
        type: tile
        entity: sensor.energy_meter_p
        name: Importing
        icon: mdi:transmission-tower-import
        color: red
        grid_options:
          columns: 9
      - &sol_t3
        type: tile
        entity: sensor.grid_imported_today
        name: Imported
        icon: mdi:transmission-tower-import
        color: red
        grid_options:
          columns: 9

  - type: grid
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(max-width: 899px)"
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - <<: *sol_h_now
        grid_options:
          columns: 12
      - <<: *sol_g_now
        grid_options:
          columns: 6
          rows: 3
      - <<: *sol_n1
        grid_options:
          columns: 6
      - <<: *sol_n2
        grid_options:
          columns: 6
      - <<: *sol_n3
        grid_options:
          columns: 6
      - <<: *sol_h_today
        grid_options:
          columns: 12
      - <<: *sol_g_today
        grid_options:
          columns: 6
          rows: 3
      - <<: *sol_t1
        grid_options:
          columns: 6
      - <<: *sol_t2
        grid_options:
          columns: 6
      - <<: *sol_t3
        grid_options:
          columns: 6

  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: ENERGY FLOW
        heading_style: subtitle
      - type: custom:sankey-chart
        show_names: true
        height: 160
        nodes:
          - id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 0
            name: Solar
            color: var(--amber-color)
          - id: sensor.energy_meter_p
            section: 0
            name: Grid import
            color: var(--red-color)
          - id: sensor.energy_meter_po
            section: 1
            name: Grid export
            color: var(--green-color)
          - id: house_consumption
            entity_id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 1
            name: House
            color: var(--blue-color)
            add_entities:
              - sensor.energy_meter_p
            subtract_entities:
              - sensor.energy_meter_po
        links:
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: sensor.energy_meter_po
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: house_consumption
          - source: sensor.energy_meter_p
            target: house_consumption
        grid_options:
          columns: full
