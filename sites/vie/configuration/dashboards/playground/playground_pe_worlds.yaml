                      "--mdc-icon-size": "clamp(40px, 18cqw, 200px)"
                      color: var(--blue-color)
              - type: conditional
                conditions:
                  - condition: state
                    entity: weather.home
                    state: exceptional
                elements:
                  - type: icon
                    entity: weather.home
                    icon: mdi:alert-circle-outline
                    style:
                      left: 14%
                      top: 18.2%
                      "--mdc-icon-size": "clamp(40px, 18cqw, 200px)"
                      color: var(--blue-color)
              - type: state-label
                entity: weather.home
                attribute: temperature
                suffix: "°"
                style:
                  left: 28%
                  top: 18.2%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(56px, 20cqw, 150px)"
                  font-weight: 700
                  line-height: 1
                  letter-spacing: -0.02em
                  color: var(--primary-text-color)
              - type: state-label
                entity: weather.home
                style:
                  left: 6%
                  top: 41.6%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(16px, 6.2cqw, 30px)"
                  font-weight: 600
                  color: var(--primary-text-color)
              - type: state-label
                entity: sensor.weather_today_low
                prefix: "Low "
                style:
                  left: 6%
                  top: 54.6%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 4.8cqw, 24px)"
                  color: var(--secondary-text-color)
              - type: state-label
                entity: sensor.weather_today_high
                prefix: "High "
                style:
                  left: 52%
                  top: 54.6%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 4.8cqw, 24px)"
                  color: var(--secondary-text-color)
              - type: state-label
                entity: weather.home
                attribute: humidity
                prefix: "Humidity "
                suffix: " %"
                style:
                  left: 6%
                  top: 71.5%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 4.6cqw, 24px)"
                  font-weight: 600
                  color: var(--primary-text-color)
              - type: state-label
                entity: weather.home
                attribute: pressure
                prefix: "Pressure "
                suffix: " hPa"
                style:
                  left: 6%
                  top: 85.8%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 4.6cqw, 24px)"
                  font-weight: 600
                  color: var(--primary-text-color)
              - type: state-label
                entity: weather.home
                attribute: wind_speed
                prefix: "Wind "
                suffix: " km/h"
                style:
                  left: 52%
                  top: 71.5%
                  transform: "translate(0, -50%)"
                  font-size: "clamp(14px, 4.6cqw, 24px)"
                  font-weight: 600
                  color: var(--primary-text-color)
        grid_options:
          columns: full

  - type: grid
    row_span: 2
    column_span: 2
    cards:
      - type: heading
        heading: INSIDE
        heading_style: subtitle
      - &room_living_room
        type: custom:mushroom-template-card
        entity: binary_sensor.living_room_safety_status
        primary: Living Room
        secondary: >-
          {% set t = states('sensor.living_room_living_room_temperature_humidity_temperature') | float(0) %}{% set s = state_attr('binary_sensor.living_room_safety_status', 'summary') %}{% if s != 'All clear' %}{{ s }}{% else %}{{ t | round(1) }} °C · {{ states('sensor.living_room_living_room_temperature_humidity_humidity') | float(0) | round(0) | int }} %{% endif %}
        icon: mdi:sofa
        layout: vertical
        fill_container: true
        icon_color: "{{ 'red' if is_state('binary_sensor.living_room_safety_status', 'on') else ('orange' if state_attr('binary_sensor.living_room_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/living_room
        grid_options:
          columns: 6
          rows: 3
