        icon: mdi:thermometer
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: sensor.ecowitt_temp2
        primary: >-
          {{ states('sensor.ecowitt_temp2') | float(0) | round(1) }} °C
