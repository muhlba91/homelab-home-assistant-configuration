# Playground variant "overview_hero": a redesign of the Overview tab (not the live one). Not validated by
# scripts/validate_dashboard.py. See DASHBOARD.md, "Playground dashboard".
title: Overview Hero
path: overview_hero
icon: mdi:home-heart
theme: playground_lift
type: sections
max_columns: 3
sections:
  - type: grid
    background:
      color: red
      opacity: 18
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.house_safety_status
        state_not: "off"
    cards:
      - type: heading
        heading: NEEDS ATTENTION
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: binary_sensor.house_safety_status
        primary: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
        secondary: Tap for details
        icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
        icon_color: "{{ 'red' if is_state('binary_sensor.house_safety_status', 'on') else 'orange' }}"
        tap_action:
          action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      color: purple
      opacity: 25
    column_span: 3
    visibility:
      - condition: state
        entity: switch.presence_simulation
        state: "on"
    cards:
      - type: heading
        heading: PRESENCE SIMULATION
        heading_style: subtitle
      - type: tile
        entity: switch.presence_simulation
        name: Presence simulation is on
        icon: mdi:account-clock
        color: purple
        state_content:
          - state
          - last_changed
        features_position: inline
        features:
          - type: toggle
        grid_options:
          columns: full

  - type: grid
    background:
      color: blue
      opacity: 12
    column_span: 3
    cards:
      - type: clock
        clock_style: digital
        clock_size: large
        no_background: true
        date_format:
          - weekday-long
          - day-numeric
          - month-long
        grid_options:
          columns: 5
      - type: weather-forecast
        entity: weather.home
        show_current: true
        show_forecast: true
        forecast_slots: 5
        secondary_info_attribute: humidity
        grid_options:
          columns: 7
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.house_safety_status
            content: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.house_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.house_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: sun.sun
            icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
            icon_color: amber
            content: >-
              {% set next = state_attr('sun.sun', 'next_setting') if
              is_state('sun.sun', 'above_horizon') else
              state_attr('sun.sun', 'next_rising') %}
              {% set ts = as_timestamp(next, none) %}
              {% if ts is none %}Sun times unavailable
              {% elif is_state('sun.sun', 'above_horizon') %}Sunset {{ ts | timestamp_custom('%H:%M') }}
              {% else %}Sunrise {{ ts | timestamp_custom('%H:%M') }}{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: sensor.house_ac_status
            content: "{{ state_attr('sensor.house_ac_status', 'summary') }}"
            icon: "{{ state_attr('sensor.house_ac_status', 'icon') }}"
            icon_color: "{{ 'blue' if states('sensor.house_ac_status') | int(0) > 0 else 'grey' }}"
            tap_action:
              action: more-info
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 2
    cards:
      - type: heading
        heading: INDOOR CLIMATE
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: sensor.house_ac_status
            content: "{{ state_attr('sensor.house_ac_status', 'summary') }}"
            icon: "{{ state_attr('sensor.house_ac_status', 'icon') }}"
            icon_color: "{{ 'blue' if states('sensor.house_ac_status') | int(0) > 0 else 'grey' }}"
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: custom:modern-circular-gauge
        entity: sensor.living_room_living_room_temperature_humidity_temperature
        name: >-
          {%- set m = states('climate.living_room_air_conditioner') -%}
          {%- set w = {'cool': 'Cooling', 'heat': 'Heating', 'dry': 'Drying',
          'fan_only': 'Fan only', 'heat_cool': 'Auto', 'auto': 'Auto'} -%}
          Living Room{{ ' · ' ~ w[m] if m in w else '' }}
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.living_room_living_room_temperature_humidity_humidity
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.bedroom_bedroom_temperature_humidity_temperature
        name: >-
          {%- set m = states('climate.bedroom_air_conditioner') -%}
          {%- set w = {'cool': 'Cooling', 'heat': 'Heating', 'dry': 'Drying',
          'fan_only': 'Fan only', 'heat_cool': 'Auto', 'auto': 'Auto'} -%}
          Bedroom{{ ' · ' ~ w[m] if m in w else '' }}
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.bedroom_bedroom_temperature_humidity_humidity
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.office_office_temperature_humidity_temperature
        name: >-
          {%- set m = states('climate.office_air_conditioner') -%}
          {%- set w = {'cool': 'Cooling', 'heat': 'Heating', 'dry': 'Drying',
          'fan_only': 'Fan only', 'heat_cool': 'Auto', 'auto': 'Auto'} -%}
          Office{{ ' · ' ~ w[m] if m in w else '' }}
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.office_office_temperature_humidity_humidity
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.tea_room_tea_room_temperature_humidity_temperature
        name: Tea Room
        min: 15
        max: 28
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.tea_room_tea_room_temperature_humidity_humidity
        grid_options:
          columns: 6
          rows: 3

  - type: grid
    background:
      opacity: 100
    column_span: 1
    cards:
      - type: heading
        heading: WEATHER STATION
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:thermometer-lines
            icon_color: grey
            content: >-
              {% set s = states('sensor.ecowitt_temp1') %}
              {% set n = states('sensor.ecowitt_temp2') %}
              {% if not (s | is_number and n | is_number) %}Sensors unavailable
              {% elif s | float >= n | float %}South +{{ (s | float - n | float) | round(1) }} °C
              {% else %}North +{{ (n | float - s | float) | round(1) }} °C{% endif %}
        grid_options:
          columns: full
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp1
        name: South
        min: 5
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.ecowitt_humidity1
        grid_options:
          columns: 6
          rows: 3
      - type: custom:modern-circular-gauge
        entity: sensor.ecowitt_temp2
        name: North
        min: 5
        max: 35
        show_icon: false
        gauge_foreground_style:
          color: 'var(--blue-color)'
        gauge_background_style:
          color: var(--divider-color)
        secondary:
          entity: sensor.ecowitt_humidity2
        grid_options:
          columns: 6
          rows: 3

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(min-width: 900px)"
    cards:
      - type: heading
        heading: ROOMS
        heading_style: subtitle
      - &room_living_room
        type: custom:mushroom-template-card
        entity: binary_sensor.living_room_safety_status
        primary: Living Room
        secondary: "{{ states('sensor.living_room_living_room_temperature_humidity_temperature') | float(0) | round(1) }} °C · {{ state_attr('binary_sensor.living_room_safety_status', 'summary') }}"
        icon: mdi:sofa
        icon_color: "{{ 'red' if is_state('binary_sensor.living_room_safety_status', 'on') else ('orange' if state_attr('binary_sensor.living_room_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/living_room
        grid_options:
          columns: 3
      - &room_office
        type: custom:mushroom-template-card
        entity: binary_sensor.office_safety_status
        primary: Office
        secondary: "{{ states('sensor.office_office_temperature_humidity_temperature') | float(0) | round(1) }} °C · {{ state_attr('binary_sensor.office_safety_status', 'summary') }}"
        icon: mdi:desk
        icon_color: "{{ 'red' if is_state('binary_sensor.office_safety_status', 'on') else ('orange' if state_attr('binary_sensor.office_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/office
        grid_options:
          columns: 3
      - &room_tea_room
        type: custom:mushroom-template-card
        entity: binary_sensor.tea_room_safety_status
        primary: Tea Room
        secondary: "{{ states('sensor.tea_room_tea_room_temperature_humidity_temperature') | float(0) | round(1) }} °C · {{ state_attr('binary_sensor.tea_room_safety_status', 'summary') }}"
        icon: mdi:tea
        icon_color: "{{ 'red' if is_state('binary_sensor.tea_room_safety_status', 'on') else ('orange' if state_attr('binary_sensor.tea_room_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/tea_room
        grid_options:
          columns: 3
      - &room_bedroom
        type: custom:mushroom-template-card
        entity: binary_sensor.bedroom_safety_status
        primary: Bedroom
        secondary: "{{ states('sensor.bedroom_bedroom_temperature_humidity_temperature') | float(0) | round(1) }} °C · {{ state_attr('binary_sensor.bedroom_safety_status', 'summary') }}"
        icon: mdi:bed
        icon_color: "{{ 'red' if is_state('binary_sensor.bedroom_safety_status', 'on') else ('orange' if state_attr('binary_sensor.bedroom_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/bedroom
        grid_options:
          columns: 3
      - &room_bathrooms
        type: custom:mushroom-template-card
        entity: binary_sensor.bathrooms_safety_status
        primary: Bathrooms
        secondary: "{{ state_attr('binary_sensor.bathrooms_safety_status', 'summary') }}"
        icon: mdi:shower
        icon_color: "{{ 'red' if is_state('binary_sensor.bathrooms_safety_status', 'on') else ('orange' if state_attr('binary_sensor.bathrooms_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/bathrooms
        grid_options:
          columns: 3
      - &room_hallways
        type: custom:mushroom-template-card
        entity: binary_sensor.hallways_safety_status
        primary: Hallways
        secondary: "{{ state_attr('binary_sensor.hallways_safety_status', 'summary') }}"
        icon: mdi:door
        icon_color: "{{ 'red' if is_state('binary_sensor.hallways_safety_status', 'on') else ('orange' if state_attr('binary_sensor.hallways_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/hallways
        grid_options:
          columns: 3
      - &room_garden
        type: custom:mushroom-template-card
        entity: binary_sensor.garden_safety_status
        primary: Garden
        secondary: "{{ states('sensor.ecowitt_temp2') | float(0) | round(1) }} °C · {{ state_attr('binary_sensor.garden_safety_status', 'summary') }}"
        icon: mdi:tree
        icon_color: "{{ 'red' if is_state('binary_sensor.garden_safety_status', 'on') else ('orange' if state_attr('binary_sensor.garden_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/garden
        grid_options:
          columns: 3
      - &room_utility
        type: custom:mushroom-template-card
        entity: binary_sensor.utility_safety_status
        primary: Utility
        secondary: "{{ state_attr('binary_sensor.utility_safety_status', 'summary') }}"
        icon: mdi:washing-machine
        icon_color: "{{ 'red' if is_state('binary_sensor.utility_safety_status', 'on') else ('orange' if state_attr('binary_sensor.utility_safety_status', 'summary') != 'All clear' else 'blue') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/utility
        grid_options:
          columns: 3

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: screen
        media_query: "(max-width: 899px)"
    cards:
      - type: heading
        heading: ROOMS
        heading_style: subtitle
      - <<: *room_living_room
        grid_options:
          columns: 6
      - <<: *room_office
        grid_options:
          columns: 6
      - <<: *room_tea_room
        grid_options:
          columns: 6
      - <<: *room_bedroom
        grid_options:
          columns: 6
      - <<: *room_bathrooms
        grid_options:
          columns: 6
      - <<: *room_hallways
        grid_options:
          columns: 6
      - <<: *room_garden
        grid_options:
          columns: 6
      - <<: *room_utility
        grid_options:
          columns: 6

  - type: grid
    background:
      opacity: 100
    column_span: 3
    visibility:
      - condition: state
        entity: binary_sensor.washing_machine_active
        state: "on"
    cards:
      - type: heading
        heading: WASHING MACHINE
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.washing_machine_status
        primary: Washing machine
        secondary: "{{ state_attr('sensor.washing_machine_status', 'overview') }}"
        icon: "{{ state_attr('sensor.washing_machine_status', 'icon') }}"
        icon_color: "{{ state_attr('sensor.washing_machine_status', 'color') }}"
        tap_action:
          action: navigate
          navigation_path: /lovelace/utility
        grid_options:
          columns: full

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SECURITY & SAFETY
        heading_style: subtitle
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: binary_sensor.house_safety_status
            content: "{{ state_attr('binary_sensor.house_safety_status', 'summary') }}"
            icon: "{{ state_attr('binary_sensor.house_safety_status', 'icon') }}"
            icon_color: >-
              {% if is_state('binary_sensor.house_safety_status', 'on') %}red
              {% elif state_attr('binary_sensor.house_safety_status', 'summary') != 'All clear' %}orange
              {% else %}green{% endif %}
            tap_action:
              action: more-info
        grid_options:
          columns: full
      - type: tile
        entity: alarm_control_panel.ring_control_panel
        name: Alarm
        grid_options:
          columns: 12
      - type: tile
        entity: lock.entrance_door_lock
        name: Front Door
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        entity: group.safety_smoke_detectors
        primary: Smoke
        secondary: >-
          {% set members = expand('group.safety_smoke_detectors') %}
          {% set on = members | selectattr('state', 'eq', 'on') | list | count %}
          {{ 'All clear (' ~ members | count ~ ')' if on == 0 else on ~ ' triggered!' }}
        icon: mdi:smoke-detector
        icon_color: >-
          {{ 'green' if expand('group.safety_smoke_detectors') | selectattr('state', 'eq', 'on') | list | count == 0 else 'red' }}
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: group.safety_water_leak_sensors
        primary: Water leaks
        secondary: >-
          {% set members = expand('group.safety_water_leak_sensors') %}
          {% set on = members | selectattr('state', 'eq', 'on') | list | count %}
          {{ 'Dry (' ~ members | count ~ ')' if on == 0 else on ~ ' wet!' }}
        icon: mdi:water-alert
        icon_color: >-
          {{ 'green' if expand('group.safety_water_leak_sensors') | selectattr('state', 'eq', 'on') | list | count == 0 else 'red' }}
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: group.safety_doors_and_windows
        primary: Doors & windows
        secondary: >-
          {% set members = expand('group.safety_doors_and_windows') %}
          {% set on = members | selectattr('state', 'eq', 'on') | list | count %}
          {{ 'All closed (' ~ members | count ~ ')' if on == 0 else on ~ ' open' }}
        icon: mdi:door-open
        icon_color: >-
          {{ 'green' if expand('group.safety_doors_and_windows') | selectattr('state', 'eq', 'on') | list | count == 0 else 'orange' }}
        tap_action:
          action: more-info
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        entity: sensor.house_battery_status
        primary: Batteries
        secondary: "{{ state_attr('sensor.house_battery_status', 'summary') }}"
        icon: "{{ 'mdi:battery-alert' if states('sensor.house_battery_status') | int(0) > 0 else 'mdi:battery' }}"
        icon_color: "{{ 'orange' if states('sensor.house_battery_status') | int(0) > 0 else 'green' }}"
        tap_action:
          action: more-info
        grid_options:
          columns: 6

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: SOLAR & ENERGY
        heading_style: subtitle
      - type: vertical-stack
        grid_options:
          columns: 18
        cards:
          - type: heading
            heading: NOW
            heading_style: subtitle
          - type: horizontal-stack
            cards:
              - type: markdown
                content: " "
              - type: custom:modern-circular-gauge
                entity: sensor.pv_power_photovoltaics_fronius_power_flow
                name: Solar
                min: 0
                max: 5000
                show_icon: false
                gauge_foreground_style:
                  color: 'var(--amber-color)'
                gauge_background_style:
                  color: var(--divider-color)
              - type: markdown
                content: " "
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.solar_own_use_power
                name: Own use
                icon: mdi:home-lightning-bolt
                color: amber
                vertical: true
              - type: tile
                entity: sensor.energy_meter_po
                name: Exporting
                icon: mdi:transmission-tower-export
                color: green
                vertical: true
              - type: tile
                entity: sensor.energy_meter_p
                name: Importing
                icon: mdi:transmission-tower-import
                color: red
                vertical: true
      - type: vertical-stack
        grid_options:
          columns: 18
        cards:
          - type: heading
            heading: TODAY
            heading_style: subtitle
          - type: horizontal-stack
            cards:
              - type: markdown
                content: " "
              - type: custom:modern-circular-gauge
                entity: sensor.solar_produced_today
                name: Produced
                min: 0
                max: 35
                show_icon: false
                gauge_foreground_style:
                  color: 'var(--amber-color)'
                gauge_background_style:
                  color: var(--divider-color)
              - type: markdown
                content: " "
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.solar_own_use_today
                name: Own use
                icon: mdi:home-lightning-bolt
                color: amber
                vertical: true
              - type: tile
                entity: sensor.grid_exported_today
                name: Exported
                icon: mdi:transmission-tower-export
                color: green
                vertical: true
              - type: tile
                entity: sensor.grid_imported_today
                name: Imported
                icon: mdi:transmission-tower-import
                color: red
                vertical: true

  - type: grid
    background:
      opacity: 100
    column_span: 3
    cards:
      - type: heading
        heading: ENERGY FLOW
        heading_style: subtitle
      - type: custom:sankey-chart
        show_names: true
        height: 160
        nodes:
          - id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 0
            name: Solar
            color: var(--amber-color)
          - id: sensor.energy_meter_p
            section: 0
            name: Grid import
            color: var(--red-color)
          - id: sensor.energy_meter_po
            section: 1
            name: Grid export
            color: var(--green-color)
          - id: house_consumption
            entity_id: sensor.pv_power_photovoltaics_fronius_power_flow
            section: 1
            name: House
            color: var(--blue-color)
            add_entities:
              - sensor.energy_meter_p
            subtract_entities:
              - sensor.energy_meter_po
        links:
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: sensor.energy_meter_po
          - source: sensor.pv_power_photovoltaics_fronius_power_flow
            target: house_consumption
          - source: sensor.energy_meter_p
            target: house_consumption
        grid_options:
          columns: full
