---
dashboards:
  # The key "lovelace" replaces the built-in Overview (URL /lovelace).
  # Which dashboard opens first is a UI setting (system default for all users,
  # optional per-user override): see DASHBOARD.md, "Registration and default
  # dashboard".
  lovelace:
    mode: yaml
    filename: ui-lovelace.yaml
    title: Home
    icon: mdi:home-heart
    show_in_sidebar: true

  # Private test dashboard (URL /home-playground), administrators only.
  # The key must contain a hyphen and be a lowercase slug.
  home-playground:
    mode: yaml
    filename: ui-lovelace-playground.yaml
    title: Playground
    icon: mdi:flask
    show_in_sidebar: true
    require_admin: true
